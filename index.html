<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cube Quest</title>
<style>
  :root {
    --bg: #14121f;
    --panel: #221d38;
    --border: #3b3366;
    --text: #f4f1ff;
    --muted: #a99fd6;
    --accent: #ffd166;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 8, 20, .55); backdrop-filter: blur(3px); padding: 16px; box-sizing: border-box;
  }
  #overlay.hidden { display: none; }
  .panel {
    text-align: center; padding: 28px 32px; background: var(--panel);
    border: 2px solid var(--border); border-radius: 20px; max-width: 440px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); box-sizing: border-box;
  }
  h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: 1px; color: var(--accent); }
  h2 { margin: 0 0 12px; font-size: 32px; }
  p { margin: 8px 0; color: var(--muted); line-height: 1.5; }
  .big { font-size: 22px; color: var(--text); }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; text-align: left; margin: 18px auto; max-width: 320px; }
  .keys span:nth-child(odd) { text-align: right; }
  kbd {
    display: inline-block; min-width: 22px; padding: 3px 7px; border-radius: 6px;
    background: #2f2853; border: 1px solid #4a4080; border-bottom-width: 3px;
    font: 600 13px ui-monospace, monospace; color: var(--text); text-align: center;
  }
  button {
    margin-top: 14px; padding: 12px 34px; font: 700 18px inherit; font-family: inherit;
    color: #1b1530; background: var(--accent); border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 4px 0 #c9982f;
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #c9982f; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>

<script>
(() => {
  'use strict';

  // ---------- Setup ----------
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  let VW = 0, VH = 0, DPR = 1, zoom = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    VW = innerWidth; VH = innerHeight;
    cv.width = VW * DPR; cv.height = VH * DPR;
    cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
    zoom = Math.max(0.6, Math.min(1, Math.min(VW, VH) / 700));
  }
  addEventListener('resize', resize);
  resize();

  const TILE = 64;
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function loadBest() { try { return +localStorage.getItem('cubequest-best') || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem('cubequest-best', String(v)); } catch (e) {} }

  // ---------- Audio ----------
  let actx = null, muted = false;
  function initAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      else if (actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function sfx(freq, dur = 0.1, type = 'square', vol = 0.05, slide = 0) {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur);
  }

  // ---------- Input ----------
  const keys = {};
  let wantDash = false, isTouch = false;
  const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };

  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    initAudio();
    if ((e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !e.repeat) wantDash = true;
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    if (e.code === 'KeyM') muted = !muted;
    if (e.code === 'Enter' && state !== 'play') startOrResume();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
    if (state === 'play') togglePause();
  });

  cv.addEventListener('touchstart', e => {
    isTouch = true; initAudio();
    for (const t of e.changedTouches) {
      if (t.clientX < VW * 0.6 && joy.id === null) {
        joy.id = t.identifier; joy.ox = joy.x = t.clientX; joy.oy = joy.y = t.clientY;
      } else {
        wantDash = true;
      }
    }
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.x = t.clientX; joy.y = t.clientY; }
    e.preventDefault();
  }, { passive: false });
  const endTouch = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) joy.id = null; };
  cv.addEventListener('touchend', endTouch);
  cv.addEventListener('touchcancel', endTouch);

  function inputVector() {
    let x = 0, y = 0;
    if (keys.KeyD || keys.ArrowRight) x += 1;
    if (keys.KeyA || keys.ArrowLeft) x -= 1;
    if (keys.KeyS || keys.ArrowDown) y += 1;
    if (keys.KeyW || keys.ArrowUp) y -= 1;
    if (joy.id !== null) {
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
      if (d > 8) { const m = Math.min(1, d / 50); x += dx / d * m; y += dy / d * m; }
    }
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    return { x, y };
  }

  // ---------- World ----------
  let cols = 0, rows = 0, grid = null, hue = 250;
  let player, enemies, gems, particles, texts, portal;
  let level = 1, score = 0, lives = 3, best = loadBest();
  let state = 'menu', levelT = 0, totalGems = 0;
  let cam = { x: 0, y: 0 }, shake = 0, banner = { text: '', t: 0 };
  let flow = null, flowT = 0, time = 0;

  const solid = (cx, cy) => cx < 0 || cy < 0 || cx >= cols || cy >= rows || grid[cy * cols + cx] === 1;

  function bfs(sx, sy) {
    const dist = new Int32Array(cols * rows).fill(-1);
    const start = sy * cols + sx;
    if (solid(sx, sy)) return dist;
    const q = [start]; dist[start] = 0;
    for (let h = 0; h < q.length; h++) {
      const i = q[h], x = i % cols, y = (i / cols) | 0;
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (solid(nx, ny)) continue;
        const j = ny * cols + nx;
        if (dist[j] >= 0) continue;
        dist[j] = dist[i] + 1;
        q.push(j);
      }
    }
    return dist;
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function genLevel(n) {
    const size = Math.min(16 + n * 2, 36);
    cols = rows = size;
    grid = new Uint8Array(cols * rows);
    hue = (250 + (n - 1) * 47) % 360;

    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
      if (x === 0 || y === 0 || x === cols - 1 || y === rows - 1) grid[y * cols + x] = 1;

    const blocks = Math.floor(size * (0.8 + Math.min(n, 8) * 0.05));
    for (let k = 0; k < blocks; k++) {
      const w = 1 + ((Math.random() * 3) | 0), h = 1 + ((Math.random() * 3) | 0);
      const bx = 1 + ((Math.random() * (cols - 2 - w)) | 0), by = 1 + ((Math.random() * (rows - 2 - h)) | 0);
      for (let y = by; y < by + h; y++) for (let x = bx; x < bx + w; x++) grid[y * cols + x] = 1;
    }

    const sx = cols >> 1, sy = rows >> 1;
    for (let y = sy - 1; y <= sy + 1; y++) for (let x = sx - 1; x <= sx + 1; x++) grid[y * cols + x] = 0;

    const dist = bfs(sx, sy);
    const open = [];
    for (let i = 0; i < grid.length; i++) {
      if (grid[i]) continue;
      if (dist[i] < 0) grid[i] = 1; // seal off unreachable pockets
      else open.push(i);
    }

    player = {
      x: sx * TILE + TILE / 2, y: sy * TILE + TILE / 2, h: 17, vx: 0, vy: 0,
      fx: 0, fy: 1, dashT: 0, dashCd: 0, invuln: 1.5, moving: false,
    };

    const gemCount = Math.min(6 + n * 2, 30);
    const gemCells = shuffle(open.filter(i => dist[i] > 1)).slice(0, gemCount);
    gems = gemCells.map(i => ({ x: (i % cols) * TILE + TILE / 2, y: ((i / cols) | 0) * TILE + TILE / 2, phase: Math.random() * 6.28 }));
    totalGems = gems.length;

    const enemyCount = Math.min(2 + n, 14);
    const far = shuffle(open.filter(i => dist[i] > 6));
    enemies = [];
    for (let k = 0; k < enemyCount && k < far.length; k++) {
      const i = far[k];
      const chaser = k < Math.floor(enemyCount * Math.min(0.25 + n * 0.06, 0.6));
      const a = Math.random() * Math.PI * 2;
      enemies.push({
        x: (i % cols) * TILE + TILE / 2, y: ((i / cols) | 0) * TILE + TILE / 2, h: 15,
        type: chaser ? 'chaser' : 'wander',
        speed: chaser ? Math.min(110 + n * 7, 210) : Math.min(80 + n * 6, 170),
        dx: Math.cos(a), dy: Math.sin(a), turnT: rand(1.5, 3.5), stun: 0, alert: false,
      });
    }

    particles = []; texts = []; portal = null; levelT = 0;
    flow = null; flowT = 0;
    cam.x = player.x; cam.y = player.y;
  }

  // ---------- Physics ----------
  function hitsWall(x, y, h) {
    const x0 = Math.floor((x - h) / TILE), x1 = Math.floor((x + h - 0.001) / TILE);
    const y0 = Math.floor((y - h) / TILE), y1 = Math.floor((y + h - 0.001) / TILE);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) if (solid(cx, cy)) return true;
    return false;
  }

  // Moves an entity, sliding along walls. Returns which axes were blocked.
  function move(e, dx, dy) {
    let bx = false, by = false;
    if (dx) {
      const nx = e.x + dx;
      if (!hitsWall(nx, e.y, e.h)) e.x = nx;
      else {
        e.x = dx > 0 ? Math.floor((nx + e.h) / TILE) * TILE - e.h - 0.01
                     : (Math.floor((nx - e.h) / TILE) + 1) * TILE + e.h + 0.01;
        bx = true;
      }
    }
    if (dy) {
      const ny = e.y + dy;
      if (!hitsWall(e.x, ny, e.h)) e.y = ny;
      else {
        e.y = dy > 0 ? Math.floor((ny + e.h) / TILE) * TILE - e.h - 0.01
                     : (Math.floor((ny - e.h) / TILE) + 1) * TILE + e.h + 0.01;
        by = true;
      }
    }
    return { bx, by };
  }

  function burst(x, y, color, count = 14, speed = 220) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(0.3, 1) * speed;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.35, 0.7), max: 0.7, color, size: rand(3, 7) });
    }
  }
  function floatText(x, y, text, color = '#fff') { texts.push({ x, y, text, color, life: 1 }); }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    if (banner.t > 0) banner.t -= dt;
    shake = Math.max(0, shake - dt * 40);

    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    for (const t of texts) { t.y -= 40 * dt; t.life -= dt; }
    texts = texts.filter(t => t.life > 0);

    if (state !== 'play') { updateEnemies(dt, false); return; }

    levelT += dt;
    updatePlayer(dt);
    updateEnemies(dt, true);

    // Gems
    for (let i = gems.length - 1; i >= 0; i--) {
      const g = gems[i];
      if (Math.hypot(g.x - player.x, g.y - player.y) < 32) {
        gems.splice(i, 1);
        score += 10;
        burst(g.x, g.y, '#5ef2ff', 12, 180);
        floatText(g.x, g.y - 30, '+10', '#5ef2ff');
        sfx(880 + (totalGems - gems.length) * 30, 0.12, 'triangle', 0.07, 400);
        if (gems.length === 0) openPortal();
      }
    }

    // Portal
    if (portal) {
      portal.t += dt;
      if (Math.hypot(portal.x - player.x, portal.y - player.y) < 34) completeLevel();
    }

    // Camera
    const k = 1 - Math.exp(-8 * dt);
    cam.x += (player.x - cam.x) * k;
    cam.y += (player.y - cam.y) * k;
  }

  function updatePlayer(dt) {
    const p = player;
    const inp = inputVector();
    p.moving = inp.x !== 0 || inp.y !== 0;
    if (p.moving) { const l = Math.hypot(inp.x, inp.y); p.fx = inp.x / l; p.fy = inp.y / l; }

    p.dashCd = Math.max(0, p.dashCd - dt);
    p.invuln = Math.max(0, p.invuln - dt);

    if (wantDash && p.dashCd <= 0) {
      p.dashT = 0.17; p.dashCd = 0.85;
      p.vx = p.fx * 900; p.vy = p.fy * 900;
      shake = Math.max(shake, 4);
      sfx(220, 0.15, 'sawtooth', 0.04, 500);
    }
    wantDash = false;

    if (p.dashT > 0) {
      p.dashT -= dt;
      if (Math.random() < 0.8) particles.push({ x: p.x + rand(-8, 8), y: p.y + rand(-8, 8), vx: 0, vy: 0, life: 0.3, max: 0.3, color: '#ffd166', size: 8 });
    } else {
      const MAXV = 280, k = 1 - Math.exp(-14 * dt);
      p.vx += (inp.x * MAXV - p.vx) * k;
      p.vy += (inp.y * MAXV - p.vy) * k;
    }
    const b = move(p, p.vx * dt, p.vy * dt);
    if (b.bx) p.vx = 0;
    if (b.by) p.vy = 0;
  }

  function updateEnemies(dt, live) {
    if (!enemies) return;
    if (live) {
      flowT -= dt;
      if (flowT <= 0) { flow = bfs(Math.floor(player.x / TILE), Math.floor(player.y / TILE)); flowT = 0.25; }
    }

    for (const e of enemies) {
      if (e.stun > 0) { e.stun -= dt; continue; }
      let mx = e.dx, my = e.dy, speed = e.speed;
      e.alert = false;

      if (live && e.type === 'chaser' && flow) {
        const cx = Math.floor(e.x / TILE), cy = Math.floor(e.y / TILE);
        const d = flow[cy * cols + cx];
        if (d >= 0 && d <= 8) {
          e.alert = true;
          let tx = player.x, ty = player.y;
          if (d > 0) {
            for (const [ddx, ddy] of DIRS) {
              const nx = cx + ddx, ny = cy + ddy;
              if (!solid(nx, ny) && flow[ny * cols + nx] === d - 1) { tx = nx * TILE + TILE / 2; ty = ny * TILE + TILE / 2; break; }
            }
          }
          const l = Math.hypot(tx - e.x, ty - e.y) || 1;
          mx = (tx - e.x) / l; my = (ty - e.y) / l;
        }
      }

      if (!e.alert) {
        e.turnT -= dt;
        if (e.turnT <= 0) {
          const a = Math.random() * Math.PI * 2;
          e.dx = Math.cos(a); e.dy = Math.sin(a); e.turnT = rand(1.5, 3.5);
        }
        mx = e.dx; my = e.dy; speed *= e.type === 'chaser' ? 0.6 : 1;
      }

      const b = move(e, mx * speed * dt, my * speed * dt);
      if (!e.alert) {
        if (b.bx) e.dx = -e.dx;
        if (b.by) e.dy = -e.dy;
      }

      if (!live) continue;
      const p = player;
      if (Math.abs(e.x - p.x) < e.h + p.h - 2 && Math.abs(e.y - p.y) < e.h + p.h - 2) {
        if (p.dashT > 0) {
          e.stun = 3;
          score += 25;
          burst(e.x, e.y, '#ff6b8b', 16, 260);
          floatText(e.x, e.y - 30, 'BONK +25', '#ffd166');
          sfx(140, 0.2, 'square', 0.07, -80);
          shake = Math.max(shake, 8);
        } else if (p.invuln <= 0) {
          hurt(e);
        }
      }
    }
  }

  function hurt(e) {
    const p = player;
    lives--;
    p.invuln = 1.6;
    const l = Math.hypot(p.x - e.x, p.y - e.y) || 1;
    p.vx = (p.x - e.x) / l * 500; p.vy = (p.y - e.y) / l * 500;
    shake = 14;
    burst(p.x, p.y, '#ffd166', 20, 280);
    sfx(300, 0.35, 'sawtooth', 0.08, -250);
    if (lives <= 0) gameOver();
  }

  function openPortal() {
    const dist = bfs(Math.floor(player.x / TILE), Math.floor(player.y / TILE));
    let bestI = -1, bestD = -1;
    for (let i = 0; i < dist.length; i++) if (dist[i] > bestD) { bestD = dist[i]; bestI = i; }
    portal = { x: (bestI % cols) * TILE + TILE / 2, y: ((bestI / cols) | 0) * TILE + TILE / 2, t: 0 };
    banner = { text: 'Portal open! Follow the arrow', t: 2.2 };
    sfx(523, 0.15, 'triangle', 0.07); setTimeout(() => sfx(784, 0.25, 'triangle', 0.07), 120);
  }

  function completeLevel() {
    const par = 20 + totalGems * 3;
    const bonus = 100 * level + Math.max(0, Math.round(par - levelT)) * 5;
    score += bonus;
    level++;
    if (level % 3 === 1 && lives < 5) lives++;
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => sfx(f, 0.18, 'triangle', 0.07), i * 90));
    genLevel(level);
    banner = { text: `Level ${level}  ·  +${bonus} bonus`, t: 2.5 };
  }

  // ---------- Screens ----------
  function showOverlay(html) { overlay.innerHTML = html; overlay.classList.remove('hidden'); }
  function hideOverlay() { overlay.classList.add('hidden'); }

  const controlsHtml = `
    <div class="keys">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>Move (arrows work too)</span>
      <span><kbd>Space</kbd></span><span>Dash: bonk enemies while dashing</span>
      <span><kbd>P</kbd></span><span>Pause &nbsp;·&nbsp; <kbd>M</kbd> mute</span>
    </div>
    <p>Phone: drag on the left to move, tap on the right to dash.</p>`;

  function showMenu() {
    state = 'menu';
    showOverlay(`<div class="panel">
      <h1>Cube Quest</h1>
      <p>Grab every gem, then make it to the portal. Don't let the angry cubes touch you.</p>
      ${controlsHtml}
      ${best ? `<p>Best score: <b style="color:var(--accent)">${best}</b></p>` : ''}
      <button id="go">Play</button>
    </div>`);
    document.getElementById('go').onclick = startOrResume;
  }

  function gameOver() {
    state = 'over';
    const newBest = score > best;
    if (newBest) { best = score; saveBest(best); }
    showOverlay(`<div class="panel">
      <h2>Game Over</h2>
      <p class="big">Score: <b>${score}</b> &nbsp;·&nbsp; Level ${level}</p>
      <p>${newBest ? '🎉 New best score!' : `Best: ${best}`}</p>
      <button id="go">Play again</button>
    </div>`);
    document.getElementById('go').onclick = startOrResume;
  }

  function togglePause() {
    if (state === 'play') {
      state = 'pause';
      showOverlay(`<div class="panel"><h2>Paused</h2>${controlsHtml}<button id="go">Resume</button></div>`);
      document.getElementById('go').onclick = startOrResume;
    } else if (state === 'pause') {
      startOrResume();
    }
  }

  function startOrResume() {
    initAudio();
    if (state === 'menu' || state === 'over') {
      level = 1; score = 0; lives = 3;
      genLevel(level);
      banner = { text: 'Level 1', t: 1.8 };
    }
    state = 'play';
    wantDash = false;
    hideOverlay();
  }

  // ---------- Rendering ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  // A cube seen from above at a slant: footprint (x,y,w,d), standing h tall.
  function cube(x, y, w, d, h, top, side, r = 0) {
    ctx.fillStyle = side; rr(x, y + d - h - r, w, h + r, r); ctx.fill();
    ctx.fillStyle = top;  rr(x, y - h, w, d, r); ctx.fill();
  }

  function drawWall(cx, cy) {
    const x = cx * TILE, y = cy * TILE, h = 22;
    ctx.fillStyle = `hsl(${hue},38%,30%)`; ctx.fillRect(x, y + TILE - h, TILE, h);
    ctx.fillStyle = `hsl(${hue},45%,52%)`; ctx.fillRect(x, y - h, TILE, TILE);
    ctx.strokeStyle = `hsla(${hue},70%,80%,.35)`; ctx.lineWidth = 2;
    ctx.strokeRect(x + 4, y - h + 4, TILE - 8, TILE - 8);
  }

  function drawEyes(cx, cy, fx, fy, angry, dead) {
    const ox = fx * 4, oy = fy * 3;
    for (const s of [-1, 1]) {
      const ex = cx + s * 6 + ox, ey = cy + oy;
      if (dead) {
        ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ex - 3, ey - 3); ctx.lineTo(ex + 3, ey + 3); ctx.moveTo(ex + 3, ey - 3); ctx.lineTo(ex - 3, ey + 3); ctx.stroke();
        continue;
      }
      ctx.fillStyle = '#fff'; ctx.fillRect(ex - 3.5, ey - 4, 7, 8);
      ctx.fillStyle = '#1b1530'; ctx.fillRect(ex - 2 + fx * 1.5, ey - 2 + fy * 1.5, 4, 4);
      if (angry) {
        ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(ex - 5 * s, ey - 8); ctx.lineTo(ex + 4 * s, ey - 4); ctx.stroke();
      }
    }
  }

  function drawPlayer() {
    const p = player;
    if (p.invuln > 0 && state === 'play' && Math.floor(time * 12) % 2 === 0) return;
    const bob = p.moving ? Math.abs(Math.sin(time * 14)) * 3 : 0;
    const s = p.h * 2, x = p.x - p.h, y = p.y - p.h - bob;
    cube(x, y, s, s, 14, p.dashT > 0 ? '#fff1c2' : '#ffd166', '#d99a2b', 6);
    drawEyes(p.x, y - 14 + p.h, p.fx, p.fy, false, false);
  }

  function drawEnemy(e) {
    const stunned = e.stun > 0;
    const s = e.h * 2, x = e.x - e.h, y = e.y - e.h;
    const top = stunned ? '#8a86a3' : e.type === 'chaser' ? '#ff5d73' : '#b06cff';
    const side = stunned ? '#5d5a75' : e.type === 'chaser' ? '#b8334a' : '#7a3fc4';
    const wob = stunned ? Math.sin(time * 20) * 2 : 0;
    cube(x + wob, y, s, s, 12, top, side, 5);
    const l = Math.hypot(player.x - e.x, player.y - e.y) || 1;
    drawEyes(e.x + wob, y - 12 + e.h, (player.x - e.x) / l, (player.y - e.y) / l, !stunned, stunned);
    if (e.alert) {
      ctx.fillStyle = '#ffd166'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('!', e.x, y - 20);
    }
  }

  function drawGem(g) {
    const bob = Math.sin(time * 3 + g.phase) * 4;
    const y = g.y - 22 + bob, w = 11, h = 15;
    ctx.fillStyle = '#5ef2ff';
    ctx.beginPath(); ctx.moveTo(g.x, y - h); ctx.lineTo(g.x + w, y); ctx.lineTo(g.x, y + h); ctx.lineTo(g.x - w, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c9fbff';
    ctx.beginPath(); ctx.moveTo(g.x, y - h); ctx.lineTo(g.x + w * 0.4, y - 2); ctx.lineTo(g.x - w * 0.4, y - 2); ctx.closePath(); ctx.fill();
  }

  function drawPortal() {
    const t = portal.t;
    for (let i = 0; i < 4; i++) {
      const r = 26 - i * 6 + Math.sin(t * 4 + i) * 2;
      ctx.strokeStyle = `hsla(${(t * 120 + i * 40) % 360},90%,65%,${0.9 - i * 0.15})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(portal.x, portal.y, r, r * 0.7, t * (i % 2 ? 2 : -2), 0, Math.PI * 2); ctx.stroke();
    }
  }

  function shadow(x, y, r) {
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#14121f';
    ctx.fillRect(0, 0, VW, VH);
    if (!grid) return;

    const sx = shake ? rand(-shake, shake) * 0.5 : 0, sy = shake ? rand(-shake, shake) * 0.5 : 0;
    ctx.save();
    ctx.translate(VW / 2, VH / 2);
    ctx.scale(zoom, zoom);
    ctx.translate(-cam.x + sx, -cam.y + sy);

    const halfW = VW / 2 / zoom, halfH = VH / 2 / zoom;
    const x0 = Math.max(0, Math.floor((cam.x - halfW) / TILE) - 1), x1 = Math.min(cols - 1, Math.floor((cam.x + halfW) / TILE) + 1);
    const y0 = Math.max(0, Math.floor((cam.y - halfH) / TILE) - 1), y1 = Math.min(rows - 1, Math.floor((cam.y + halfH) / TILE) + 2);

    // Floor
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      if (grid[cy * cols + cx]) continue;
      ctx.fillStyle = (cx + cy) % 2 ? '#2a2545' : '#2f2950';
      ctx.fillRect(cx * TILE, cy * TILE, TILE, TILE);
    }

    if (portal) drawPortal();
    for (const g of gems) shadow(g.x, g.y + 6, 9);
    for (const e of enemies) shadow(e.x, e.y + e.h - 2, e.h + 2);
    shadow(player.x, player.y + player.h - 2, player.h + 3);

    // Depth-sorted draw list
    const list = [];
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++)
      if (grid[cy * cols + cx]) list.push({ y: cy * TILE + TILE, k: 0, cx, cy });
    for (const g of gems) list.push({ y: g.y + 8, k: 1, o: g });
    for (const e of enemies) list.push({ y: e.y + e.h, k: 2, o: e });
    list.push({ y: player.y + player.h, k: 3 });
    list.sort((a, b) => a.y - b.y);
    for (const d of list) {
      if (d.k === 0) drawWall(d.cx, d.cy);
      else if (d.k === 1) drawGem(d.o);
      else if (d.k === 2) drawEnemy(d.o);
      else drawPlayer();
    }

    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2 - 10, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px system-ui';
    for (const t of texts) {
      ctx.globalAlpha = clamp(t.life, 0, 1);
      ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (state === 'play' || state === 'pause') drawHud();
  }

  function drawPointer(tx, ty, color) {
    const sx = (tx - cam.x) * zoom + VW / 2, sy = (ty - cam.y) * zoom + VH / 2, m = 40;
    if (sx > m && sx < VW - m && sy > m && sy < VH - m) return;
    const a = Math.atan2(sy - VH / 2, sx - VW / 2);
    const px = clamp(sx, m, VW - m), py = clamp(sy, m + 30, VH - m);
    ctx.save();
    ctx.translate(px, py); ctx.rotate(a);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-8, -11); ctx.lineTo(-3, 0); ctx.lineTo(-8, 11); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function heart(x, y, s, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s * 0.3);
    ctx.bezierCurveTo(x - s / 2, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s / 2, y + s * 0.6, x + s / 2, y + s * 0.3);
    ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * 0.3);
    ctx.fill();
  }

  function drawHud() {
    // Guidance arrow: portal if open, otherwise nearest gem when it's off-screen
    if (portal) drawPointer(portal.x, portal.y, `hsl(${(time * 120) % 360},90%,65%)`);
    else if (gems.length) {
      let g0 = gems[0], d0 = Infinity;
      for (const g of gems) { const d = Math.hypot(g.x - player.x, g.y - player.y); if (d < d0) { d0 = d; g0 = g; } }
      drawPointer(g0.x, g0.y, 'rgba(94,242,255,.8)');
    }

    ctx.fillStyle = 'rgba(20,18,31,.7)';
    rr(12, 12, 200, 64, 12); ctx.fill();
    ctx.textAlign = 'left'; ctx.fillStyle = '#f4f1ff';
    ctx.font = 'bold 16px system-ui';
    ctx.fillText(`LEVEL ${level}`, 24, 36);
    ctx.fillStyle = '#5ef2ff';
    ctx.fillText(`◆ ${totalGems - gems.length}/${totalGems}`, 120, 36);
    ctx.fillStyle = '#ffd166';
    ctx.fillText(`SCORE ${score}`, 24, 62);

    for (let i = 0; i < 5; i++) {
      if (i >= Math.max(lives, 3)) break;
      heart(VW - 30 - i * 30, 22, 22, i < lives ? '#ff5d73' : 'rgba(255,255,255,.15)');
    }

    // Dash meter
    const w = 120, x = VW / 2 - w / 2, y = VH - 28;
    const ready = player.dashCd <= 0;
    ctx.fillStyle = 'rgba(20,18,31,.7)'; rr(x - 4, y - 4, w + 8, 16, 8); ctx.fill();
    ctx.fillStyle = ready ? '#ffd166' : '#7a6a40';
    rr(x, y, w * (1 - player.dashCd / 0.85), 8, 4); ctx.fill();
    ctx.fillStyle = '#a99fd6'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(ready ? 'DASH READY' : 'dash', VW / 2, y - 8);

    if (banner.t > 0) {
      ctx.globalAlpha = clamp(banner.t, 0, 1);
      ctx.font = 'bold 30px system-ui'; ctx.fillStyle = '#fff';
      ctx.fillText(banner.text, VW / 2, VH * 0.28);
      ctx.globalAlpha = 1;
    }

    if (isTouch) {
      if (joy.id !== null) {
        ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, Math.PI * 2); ctx.stroke();
        const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy), m = Math.min(d, 50) / (d || 1);
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.beginPath(); ctx.arc(joy.ox + dx * m, joy.oy + dy * m, 22, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = ready ? 'rgba(255,209,102,.35)' : 'rgba(255,255,255,.1)';
      ctx.beginPath(); ctx.arc(VW - 70, VH - 80, 40, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui';
      ctx.fillText('DASH', VW - 70, VH - 75);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state !== 'pause') update(dt);
    render();
    requestAnimationFrame(frame);
  }

  genLevel(1); // backdrop behind the menu
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

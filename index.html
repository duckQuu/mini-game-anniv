<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Dungeon of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   ✏️  EDIT EVERYTHING IN HERE TO MAKE IT YOURS
   - {her} and {you} get replaced with the names below.
   - Multiple-choice question: give `choices` and `answer` (0 = first choice).
   - Typed question: give `answers` (any of them counts; capitals and
     punctuation don't matter).
   - `hint` shows after a wrong answer. `yay` is said after a right one.
   - Photos are optional: put image files in the repo (e.g. photos/1.jpg)
     and set photo: 'photos/1.jpg'.
   - Soundtrack: put your song in the repo (e.g. music/yue-ding.mp3).
     If the file isn't there, the built-in tune plays instead.
   ===================================================================== */
const CONFIG = {
  title: 'The Dungeon of Us',

  soundtrack: {
    file: 'music/yue-ding.mp3',
    playFrom: 'finale',  // 'start' = the whole game, 'finale' = only from the boom on (the game has the piano ballad)
    finaleStartAt: 52,   // seconds into the song to jump to at the boom: 0:52 is where the chorus starts
    volume: 0.7,
  },
  herName: 'Reika Sayangg',
  yourName: 'Juan',

  // 🤫 Your shortcut for testing: stand next to Sir Golds Gym (or talk to him)
  // and type this word. All doors open and you land next to the treasure chest.
  secretWord: 'juan',

  intro: [
    { who: '???', say: 'Psst... {her}! Over here.' },
    { who: '???', say: "Welcome to the Dungeon of Us. Deep inside, there's a treasure waiting just for you." },
    { who: '???', say: 'But every door is guarded. The guardians will test you, then ask something only you would know.' },
    { who: '???', say: 'Watch out for slimes, and grab the floating hearts. Each one hides a memory. Good luck! 💗' },
  ],

  // One entry per locked door, in order (up to 4).
  // Each guardian gives a little challenge first, then asks the questions.
  gates: [
    {
      name: 'Sir Golds Gym', kind: 'knight',
      lines: ['HALT! None shall pass without proper gains...', '...and without answering my questions, fair adventurer. 💪'],
      questions: [
        { q: 'Where did we first meet?', choices: ['At school', 'At the gym', 'Through friends', 'At a café'], answer: 1, hint: 'Somewhere we both sweat a lot 💪' },
        { q: 'What did we eat after the gym? (type it)', answers: ['habibi'], hint: 'Starts with H... and it means "my love" in Arabic 😉', yay: 'Yesss! Post-workout feast!' },
      ],
      success: 'Correct! True gym royalty. The door is yours!',
    },
    {
      name: 'Sir Matcha', kind: 'cat',
      lines: ['Mrrrow. I am Sir Matcha, guardian of the green tea. 🍵', 'Answer my question and I might move. Maybe.'],
      questions: [
        { q: 'What matcha did we first drink together? (type it)', answers: ['maicha', 'mai cha'], hint: 'Starts with M... sounds like "my cha" 🍵' },
      ],
      success: 'Purrfect. Fine, you may pass. 🍵',
    },
    {
      name: 'Boo', kind: 'ghost',
      lines: ['Oooooo... I am the ghost of anniversaries past...'],
      questions: [
        { q: 'When is our anniversary? (type it as mm-dd-yyyy)', answers: ['11-18-2024', '18-11-2024', '18 november 2024', 'november 18 2024', 'nov 18 2024', '18 nov 2024'], hint: 'November 2024... the day it all began 💗' },
        { q: 'Where did I ask you to be my girlfriend?', choices: ['At the gym', 'At the aquarium', 'Union', 'In the car'], answer: 2, hint: 'Think back to that nervous night 😳💍' },
      ],
      success: "Oooo, you remembered! I'm so happy I could cry. (Ghosts can't cry.)",
    },
    {
      name: 'Merlinda', kind: 'wizard',
      lines: ['Ah, you have come far, {her}.', 'Beyond this door lies the treasure.'],
      questions: [
        { q: "What's {you}'s nickname for you? (type it)", answers: ['rei bong', 'rey bong'], hint: 'Rei ___ 😆' },
        { q: 'Who loves you the most in the whole world?', choices: ['Sir Golds Gym', 'Sir Matcha', '{you}', 'Boo the ghost'], answer: 2, yay: 'Obviously. Everyone in this dungeon knows that.' },
      ],
      success: 'The treasure awaits you. Go on, dear.',
    },
  ],

  // A friendly frog in the garden. Catching his fireflies reveals `reward`.
  friend: {
    name: 'Pip', kind: 'frog',
    lines: [
      "Ribbit! I'm Pip, keeper of the garden.",
      'I heard there are {memories} memory hearts hidden in this dungeon. Have you found them all?',
    ],
    reward: '{you} spent ages building this whole dungeon just for you. You are VERY loved. 💚',
  },

  // Each heart she picks up shows one of these (up to 10).
  memories: [
    { text: 'I still remember how amazed I was the first time I saw your face. You are so beautiful. 😍' },
    { text: 'Do you remember how long we went out together before we finally held hands? :)' },
    { text: "I've loved you since the first time I looked at you. I was just too shy to say it. 🙈" },
    { text: 'Remember when I got angry at the aquarium? I was just so emotional there. Happy, angry and sad, all at the same time. 🐠' },
    { text: 'Please gimme a pap if you read this 📸' },
    { text: "I'm sorry if I'm not always a good bf, but I will always try my best to love you. 💗" },
  ],

  // Shown when she opens the treasure chest.
  letter: {
    title: 'Happy 2nd Anniversary, {her}! 💗',
    photo: '',
    paragraphs: [
      'Hello my love, thanks for playing until the end! 💗',
      'And thank you for staying and being my gf for 2 years (yeah, officially 2 years!). Thank you for being patient with me, thank you for loving me, and thank you for always being my best partner.',
      'The road ahead may not be smooth. We may fight, cry and shout, but the truth is I will always love you, and I know you do too.',
      '2 years is just a milestone, a short milestone for us, and I hope there will be many more milestones ahead.',
      'Let us pray, and believe that God will lead us and unite us. 🙏',
      "Let's make many happy memories in the future, together... 💗",
    ],
    signoff: 'Forever yours,\n{you}',
  },

  // 🎬 A little movie of your photos with words underneath. It plays after
  // the bouquet, before the letter. Put the pictures in the photos/ folder
  // and list them here in order. With no photos it's skipped.
  movie: {
    title: 'Our Story',
    subtitle: '{you} 💗 {her}',
    secondsPerPhoto: 6,
    musicStartAt: 0,      // the song starts from the beginning with the movie; null keeps it going
    photos: [
      { src: 'photos/01.jpg', text: 'Boo, scary 👻' },
      { src: 'photos/02.jpg', text: 'My favorite goofball 🤪' },
      { src: 'photos/03.jpg', text: 'Getting even prettier (is that possible?)' },
      { src: 'photos/04.jpg', text: 'Every call with you is the best part of my day 📱' },
      { src: 'photos/05.jpg', text: 'Making faces at me when I should be working' },
      { src: 'photos/06.jpg', text: 'You and me 💗' },
      { src: 'photos/07.jpg', text: 'So brave at the dentist 🦷' },
      { src: 'photos/08.jpg', text: 'Thanks for being close to my mom 🍊' },
      { src: 'photos/09.jpg', text: 'Every hair color looks cute on you, sooo stunning 💇\u200d♀️' },
      { src: 'photos/10.jpg', text: 'This face. I love this face.' },
      { src: 'photos/11.jpg', text: 'I love you, when you did this 💐' },
      { src: 'photos/12.jpg', text: 'Those big eyes 👀' },
      { src: 'photos/13.jpg', text: "Still picking ur nose everytime 🤍" },
      { src: 'photos/14.jpg', text: 'Us, under the sea 🐠' },
      { src: 'photos/15.jpg', text: 'My Minecraft girl ⛏️' },
      { src: 'photos/16.jpg', text: 'Pouty face, still the cutest (new eyelid)' },
      { src: 'photos/17.jpg', text: "Bald girl (still pretty tho) 💃" },
      { src: 'photos/18.jpg', text: 'Squishy cheeks 🥰' },
      { src: 'photos/19.jpg', text: 'Just you, being beautiful' },
      { src: 'photos/20.jpg', text: 'Late-night calls, wet hair and all' },
      { src: 'photos/21.jpg', text: 'Really really annoying face, but cute 😆' },
      { src: 'photos/22.jpg', text: 'Us' },
      { src: 'photos/23.jpg', text: 'Sip sip, so cute 🧋' },
      { src: 'photos/24.jpg', text: 'Peekaboo from the back seat 🚗' },
      { src: 'photos/25.jpg', text: "Messy hair, pimples, i don't care, still perfect 💕" },
      { src: 'photos/26.jpg', text: 'That shy little smile' },
      { src: 'photos/27.jpg', text: 'wtf is this :))))' },
      { src: 'photos/28.jpg', text: 'Pool shark in training 🎱' },
      { src: 'photos/29.jpg', text: 'Always make me stunned 🛍️' },
      { src: 'photos/30.jpg', text: 'So proud of you, always 💗' },
    ],
    ending: 'And our story continues… 💗',
  },
};
</script>
<style>
  :root {
    --bg: #0d0a16;
    --panel: #1d1830;
    --border: #4a3f78;
    --text: #f6f0ff;
    --muted: #b3a8d9;
    --pink: #ff8fb8;
    --gold: #ffd166;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: Fredoka, system-ui, -apple-system, "Segoe UI", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }
  .hidden { display: none !important; }

  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 5, 16, .6); backdrop-filter: blur(3px); padding: 16px; box-sizing: border-box;
    overflow: hidden;
  }
  .panel {
    position: relative; z-index: 1;
    text-align: center; padding: 28px 30px; background: var(--panel);
    border: 3px solid var(--border); border-radius: 20px; max-width: 460px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); box-sizing: border-box;
  }
  h1 { margin: 0 0 4px; font-size: 40px; color: var(--pink); line-height: 1.1; }
  .for { font-family: Caveat, cursive; font-size: 30px; color: var(--gold); margin: 4px 0 14px; }
  p { margin: 8px 0; color: var(--muted); line-height: 1.5; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; text-align: left; margin: 16px auto; max-width: 300px; color: var(--muted); }
  .keys span:nth-child(odd) { text-align: right; }
  kbd {
    display: inline-block; min-width: 20px; padding: 2px 7px; border-radius: 6px;
    background: #2f2853; border: 1px solid #4a4080; border-bottom-width: 3px;
    font: 600 13px ui-monospace, monospace; color: var(--text); text-align: center;
  }
  .btn {
    margin: 14px 6px 0; padding: 12px 30px; font: 700 18px Fredoka, system-ui, sans-serif;
    color: #2a1030; background: var(--pink); border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 4px 0 #c45585;
  }
  .btn.alt { background: #3a2f5e; color: var(--text); box-shadow: 0 4px 0 #241c40; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c45585; }

  /* Dialog */
  #dialog {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
    padding: 16px; box-sizing: border-box; pointer-events: none;
  }
  .dlg {
    pointer-events: auto; position: relative; width: min(680px, 100%); box-sizing: border-box;
    background: rgba(29, 24, 48, .96); border: 3px solid var(--pink); border-radius: 16px;
    padding: 20px 20px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6); cursor: pointer;
  }
  .dlg-name {
    position: absolute; top: -16px; left: 18px; background: var(--pink); color: #2a1030;
    font-weight: 700; padding: 3px 12px; border-radius: 10px; font-size: 15px;
  }
  .dlg-photo { display: block; max-width: 100%; max-height: 36vh; margin: 2px auto 12px; border-radius: 10px; }
  .dlg-text { font-size: 19px; line-height: 1.5; min-height: 56px; white-space: pre-line; }
  .dlg-choices { display: grid; gap: 8px; margin-top: 12px; }
  .choice {
    text-align: left; padding: 10px 14px; background: #2c2448; border: 2px solid #4a3f78;
    border-radius: 10px; color: var(--text); font: 600 16px Fredoka, system-ui, sans-serif; cursor: pointer;
  }
  .choice .n { color: var(--gold); margin-right: 8px; }
  .choice.sel, .choice:hover { border-color: var(--gold); background: #3a2f5e; }
  .dlg-input { display: flex; gap: 8px; margin-top: 12px; }
  .dlg-input input {
    flex: 1; min-width: 0; padding: 10px 12px; font: 500 17px Fredoka, system-ui, sans-serif;
    background: #120e20; color: var(--text); border: 2px solid #4a3f78; border-radius: 10px; outline: none;
  }
  .dlg-input input:focus { border-color: var(--gold); }
  .dlg-input .btn { margin: 0; padding: 10px 18px; font-size: 16px; }
  .dlg-next { position: absolute; right: 16px; bottom: 6px; color: var(--pink); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Letter */
  .letter {
    position: relative; z-index: 1; width: min(560px, 100%); max-height: 88vh; overflow-y: auto;
    background: #fff7ef; color: #4a2b3a; border-radius: 14px; padding: 30px 30px 24px; box-sizing: border-box;
    box-shadow: 0 20px 70px rgba(0,0,0,.6); text-align: center; animation: pop .6s ease-out;
  }
  .letter h2 { margin: 0 0 14px; font-size: 30px; color: #d9467f; }
  .letter img { max-width: 100%; max-height: 40vh; border-radius: 10px; margin-bottom: 12px; }
  .letter .body p {
    font-family: Caveat, cursive; font-size: 26px; line-height: 1.3; color: #4a2b3a; text-align: left;
    opacity: 0; animation: fadeIn .8s ease-out forwards;
  }
  .letter .sign { font-family: Caveat, cursive; font-size: 28px; text-align: right; white-space: pre-line; opacity: 0; animation: fadeIn .8s ease-out forwards; }
  .letter .found { color: #9b7085; font-size: 14px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .floaty { position: absolute; bottom: -40px; font-size: 26px; animation: rise linear infinite; pointer-events: none; }
  @keyframes rise { to { transform: translateY(-115vh) rotate(25deg); } }

  #finale { position: fixed; inset: 0; }

  /* Photo movie */
  #movie { position: fixed; inset: 0; background: #0d0710; overflow: hidden; display: flex; flex-direction: column; animation: fadeIn 1s ease-out; }
  .mv-stage { position: relative; flex: 1; overflow: hidden; }
  .mv-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
  .mv-slide.on { opacity: 1; }
  .mv-bg { position: absolute; inset: -40px; background: center / cover no-repeat; filter: blur(28px) brightness(.55) saturate(1.2); }
  .mv-img { position: absolute; inset: 4% 4% 0; width: 92%; height: 96%; object-fit: contain; filter: drop-shadow(0 12px 40px rgba(0,0,0,.6)); }
  .mv-slide.on .mv-img { animation: kbIn var(--dur) ease-out forwards; }
  .mv-slide.on.alt .mv-img { animation-name: kbOut; }
  @keyframes kbIn { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.09) translate(-1.5%, -1%); } }
  @keyframes kbOut { from { transform: scale(1.09) translate(1.5%, -1%); } to { transform: scale(1) translate(0, 0); } }
  .mv-card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    background: radial-gradient(circle at 50% 45%, #5a1f45, #0d0710 70%); color: #fff; }
  .mv-card h1 { font-family: Caveat, cursive; font-size: clamp(48px, 11vw, 96px); margin: 0; color: #ffd3e2; text-shadow: 0 0 30px rgba(255,111,159,.7); }
  .mv-card p { font-family: Caveat, cursive; font-size: clamp(26px, 5vw, 40px); color: #ffd166; margin: 6px 0 0; }
  .mv-cap { flex: 0 0 auto; min-height: 17vh; display: flex; align-items: center; justify-content: center; padding: 8px 20px 26px; box-sizing: border-box;
    font-family: Caveat, cursive; font-size: clamp(26px, 4.6vw, 40px); line-height: 1.15; color: #fff; text-align: center; text-shadow: 0 0 18px rgba(255,111,159,.8); }
  .mv-cap span { animation: fadeIn 1s ease-out .5s both; }
  .mv-dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 0 16px; }
  .mv-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.25); transition: background .4s, transform .4s; }
  .mv-dots i.on { background: #ff8fb8; transform: scale(1.4); }
  #mvSkip { position: absolute; top: 12px; right: 12px; z-index: 2; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 99px; padding: 8px 14px; font: 600 14px Fredoka, sans-serif; cursor: pointer; }
  #mvLetter { position: absolute; left: 50%; bottom: 4vh; transform: translateX(-50%); margin: 0; z-index: 2; animation: pop .6s ease-out; }
  #rainTop { position: fixed; inset: 0; pointer-events: none; }
  #overlay.clear { background: transparent; backdrop-filter: none; }
  #finaleBtn {
    position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); margin: 0;
    animation: pop .6s ease-out;
  }

  #wardrobeBtn {
    position: fixed; top: 12px; right: 60px; width: 40px; height: 40px; border-radius: 10px;
    background: rgba(29,24,48,.8); border: 2px solid var(--border); color: var(--text); font-size: 18px; cursor: pointer;
  }
  .wardrobe {
    position: relative; z-index: 1; width: min(860px, 100%); max-height: 94vh; overflow-y: auto; box-sizing: border-box;
    background: var(--panel); border: 3px solid var(--pink); border-radius: 20px; padding: 18px 20px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.6); user-select: none;
  }
  .wardrobe h2 { margin: 0 0 10px; color: var(--pink); font-size: 28px; }
  .wd-body { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; text-align: left; }
  .wd-preview {
    flex: 0 0 220px; border-radius: 16px; padding-bottom: 8px;
    background: radial-gradient(circle at 50% 40%, #ffe3ee 0%, #ffb3cf 55%, #c96a9c 100%);
  }
  .wd-preview canvas { width: 220px; height: 270px; display: block; }
  .wd-name { white-space: pre-line; text-align: center; font-size: 13px; color: #4a2b3a; font-weight: 600; padding: 0 8px; }
  .wd-side { flex: 1 1 380px; min-width: 0; }
  .wd-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .wd-tab {
    padding: 7px 12px; border-radius: 10px; border: 2px solid var(--border); background: #2c2448; color: var(--text);
    font: 600 14px Fredoka, system-ui, sans-serif; cursor: pointer;
  }
  .wd-tab.on { background: var(--pink); color: #2a1030; border-color: var(--pink); }
  .wd-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
  .wd-row span { width: 44px; }
  .wd-sw { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
  .wd-sw.on { border-color: var(--gold); }
  .wd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 46vh; overflow-y: auto; padding: 2px; }
  .wd-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px 8px;
    background: #fff4f8; border: 3px solid transparent; border-radius: 12px; cursor: pointer;
    font: 600 11.5px Fredoka, system-ui, sans-serif; color: #4a2b3a; line-height: 1.2;
  }
  .wd-item:hover { border-color: #ffc2da; }
  .wd-item.on { border-color: var(--gold); background: #ffe3ee; box-shadow: 0 0 0 2px #ff8fb8; }
  .wd-actions { margin-top: 6px; }

  #mute {
    position: fixed; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 10px;
    background: rgba(29,24,48,.8); border: 2px solid var(--border); color: var(--text); font-size: 18px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="mute" title="Sound (M)">🔊</button>
<button id="wardrobeBtn" class="hidden" title="Wardrobe (C)">👗</button>
<div id="dialog" class="hidden">
  <div class="dlg" id="dlg">
    <div class="dlg-name" id="dlgName"></div>
    <img class="dlg-photo hidden" id="dlgPhoto" alt="">
    <div class="dlg-text" id="dlgText"></div>
    <div class="dlg-choices" id="dlgChoices"></div>
    <form class="dlg-input hidden" id="dlgForm" autocomplete="off">
      <input id="dlgInput" placeholder="Type your answer..." autocapitalize="off" spellcheck="false">
      <button class="btn" type="submit">Answer</button>
    </form>
    <div class="dlg-next" id="dlgNext">▼</div>
  </div>
</div>
<canvas id="finale" class="hidden"></canvas>
<button class="btn hidden" id="finaleBtn">Open your letter 💌</button>
<div id="overlay"></div>
<div id="movie" class="hidden">
  <div class="mv-stage" id="mvStage"></div>
  <div class="mv-cap" id="mvCap"></div>
  <div class="mv-dots" id="mvDots"></div>
  <button id="mvSkip">Skip ⏭</button>
  <button class="btn hidden" id="mvLetter">Open your letter 💌</button>
</div>
<canvas id="rainTop" class="hidden"></canvas>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const cv = $('game'), ctx = cv.getContext('2d');
  const fog = document.createElement('canvas'), fctx = fog.getContext('2d');
  const overlay = $('overlay');
  let VW = 0, VH = 0, DPR = 1, zoom = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    VW = innerWidth; VH = innerHeight;
    cv.width = fog.width = VW * DPR; cv.height = fog.height = VH * DPR;
    cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
    zoom = Math.max(0.6, Math.min(1.1, Math.min(VW, VH) / 650));
  }
  addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[(Math.random() * a.length) | 0];
  const fmt = s => String(s)
    .replace(/\{her\}/g, CONFIG.herName)
    .replace(/\{you\}/g, CONFIG.yourName)
    .replace(/\{memories\}/g, memories ? memories.length : 0);

  // ---------- Audio ----------
  let actx = null, muted = false, musicStarted = false;
  function initAudio() {
    try {
      // let iPhones play the music even with the silent switch on
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();

    } catch (e) {}
    unlockSong();
    startMusic();
  }
  function sfx(freq, dur = 0.1, type = 'square', vol = 0.05, slide = 0) {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur);
  }
  const chime = notes => notes.forEach((f, i) => setTimeout(() => sfx(f, 0.22, 'triangle', 0.06), i * 100));

  // Your song from CONFIG.soundtrack; the chiptune below steps aside while it plays
  const ST = CONFIG.soundtrack || {};
  let song = null, songOn = false, songUnlocked = false, songFade = null;
  if (ST.file) {
    song = new Audio(ST.file);
    song.loop = true; song.preload = 'auto';
    song.addEventListener('error', () => { song = null; songOn = false; });
  }
  function unlockSong() {
    // iOS only lets audio start inside a tap, so prime it on the first one
    if (!song || songUnlocked || songOn) return;
    songUnlocked = true;
    song.muted = true;
    song.play().then(() => { if (!songOn) song.pause(); song.muted = muted; }).catch(() => { song.muted = muted; });
  }
  function fadeSong(to, secs, then) {
    clearInterval(songFade);
    const from = song.volume, t0 = performance.now();
    songFade = setInterval(() => {
      if (!song) return clearInterval(songFade);
      const k = Math.min(1, (performance.now() - t0) / (secs * 1000));
      song.volume = from + (to - from) * k;
      if (k >= 1) { clearInterval(songFade); if (then) then(); }
    }, 50);
  }
  function playSong(at) {
    if (!song) return;
    if (at !== undefined) { try { song.currentTime = at; } catch (e) {} }
    if (!songOn) song.volume = 0;
    songOn = true;
    song.muted = muted;
    song.play().catch(() => { songOn = false; });
    fadeSong(ST.volume ?? 0.7, 2.5);
  }
  function stopSong() {
    if (!song || !songOn) return;

  // An original slow piano ballad: soft arpeggios under a singing lead
  const BEAT = 60 / 72;
  const BALLAD_CHORDS = [
    [48, 60, 64, 67], [47, 59, 62, 67], [45, 57, 60, 64], [43, 55, 59, 64],
    [41, 57, 60, 65], [40, 55, 60, 64], [38, 57, 62, 65], [43, 55, 59, 62],
  ];
  // [note, beats] per bar; 0 is a rest
  const BALLAD_LEAD = [
    [[76, 1.5], [74, 0.5], [72, 1], [67, 1]], [[74, 1], [76, 0.5], [74, 0.5], [71, 2]],
    [[72, 1.5], [71, 0.5], [69, 1], [64, 1]], [[67, 1], [69, 0.5], [71, 0.5], [67, 2]],
    [[69, 1], [72, 1], [77, 1.5], [76, 0.5]], [[76, 1], [74, 0.5], [72, 0.5], [67, 2]],
    [[65, 1], [69, 1], [74, 1], [72, 0.5], [74, 0.5]], [[74, 3], [0, 1]],
    [[79, 1.5], [76, 0.5], [76, 1], [74, 0.5], [72, 0.5]], [[74, 1.5], [67, 0.5], [71, 1], [74, 1]],
    [[72, 1], [76, 1], [81, 1.5], [79, 0.5]], [[79, 1], [76, 1], [71, 2]],
    [[81, 1.5], [79, 0.5], [77, 1], [76, 1]], [[76, 1], [79, 0.5], [76, 0.5], [72, 2]],
    [[74, 1], [77, 1], [76, 1], [74, 1]], [[71, 1], [74, 1], [79, 2]],
  ];
  // which chord tone each eighth note plays, and its octave shift
  const ARP = [[0, 0], [1, 0], [2, 0], [3, 0], [1, 12], [3, 0], [2, 0], [1, 0]];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  let musicBus = null;

  function pianoNote(m, t, vol, len = 1.8) {
    const o1 = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter();
    o1.type = 'triangle'; o2.type = 'sine';
    o1.frequency.value = mtof(m); o2.frequency.value = mtof(m) * 2;
    lp.type = 'lowpass'; lp.frequency.value = 2400;
    const g2 = actx.createGain(); g2.gain.value = 0.3;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o1.connect(lp); o2.connect(g2).connect(lp); lp.connect(g).connect(musicBus);
    o1.start(t); o2.start(t); o1.stop(t + len + 0.05); o2.stop(t + len + 0.05);
  }
  function leadNote(m, t, dur, vol) {
    const o1 = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain();
    const lfo = actx.createOscillator(), depth = actx.createGain();
    o1.type = 'sine'; o2.type = 'triangle';
    o1.frequency.value = o2.frequency.value = mtof(m);
    // a little vibrato that grows as the note is held, like a voice
    lfo.frequency.value = 5.2; depth.gain.setValueAtTime(0, t); depth.gain.linearRampToValueAtTime(14, t + Math.min(0.6, dur));
    lfo.connect(depth); depth.connect(o1.detune); depth.connect(o2.detune);
    const g2 = actx.createGain(); g2.gain.value = 0.35;
    const end = t + dur + 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.06);
    g.gain.setValueAtTime(vol * 0.8, t + Math.max(0.07, dur - 0.05));
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    o1.connect(g); o2.connect(g2).connect(g); g.connect(musicBus);
    for (const o of [o1, o2, lfo]) { o.start(t); o.stop(end + 0.05); }
  }
  function padChord(ch, t, len) {
    for (const m of ch.slice(1)) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = mtof(m + 12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.012, t + len * 0.4);
      g.gain.linearRampToValueAtTime(0.0001, t + len + 0.3);
      o.connect(g).connect(musicBus);
      o.start(t); o.stop(t + len + 0.4);
    }
  }
  function scheduleBar(bar, t) {
    const ch = BALLAD_CHORDS[bar % 8], half = BEAT / 2;
    ARP.forEach(([k, up], i) => pianoNote(ch[k] + up, t + i * half, i === 0 ? 0.05 : 0.026));
    let lt = t;
    for (const [m, beats] of BALLAD_LEAD[bar % 16]) {
      if (m) leadNote(m, lt, beats * BEAT * 0.95, 0.04);
      lt += beats * BEAT;
    }
    // At the finale the pad swells in under everything
    if (fin) padChord(ch, t, BEAT * 4);
  }
  function startMusic() {
    if (musicStarted || !actx) return;
    musicStarted = true;
    musicBus = actx.createGain();
    musicBus.gain.value = muted ? 0 : 1;
    // a soft echo stands in for a concert-hall reverb
    const echo = actx.createDelay(1), fb = actx.createGain(), wet = actx.createGain(), lp = actx.createBiquadFilter();
    echo.delayTime.value = BEAT * 0.75; fb.gain.value = 0.3; wet.gain.value = 0.3; lp.type = 'lowpass'; lp.frequency.value = 1800;
    musicBus.connect(actx.destination);
    musicBus.connect(echo); echo.connect(lp).connect(fb).connect(echo); lp.connect(wet).connect(actx.destination);
    let bar = 0, next = actx.currentTime + 0.3;
    setInterval(() => {
      if (document.hidden || songOn) { next = actx.currentTime + 0.3; return; }
      while (next < actx.currentTime + 0.6) { scheduleBar(bar++, next); next += BEAT * 4; }
    }, 150);
  }
  function toggleMute() { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; if (song) song.muted = muted; if (musicBus) musicBus.gain.value = muted ? 0 : 1; }
  $('mute').onclick = e => { e.currentTarget.blur(); initAudio(); toggleMute(); };
  $('wardrobeBtn').onclick = e => { e.currentTarget.blur(); if (state === 'play' && !dlg.active) openWardrobe('play'); };

  // ---------- Map ----------
  const T = 64, FLOOR = 0, WALL = 1, VOID = 2, DOOR = 3;
  const MW = 31, MH = 28;
  const ROOMS = [
    { name: 'The Entrance',        r: [0, 18, 10, 27], floor: ['#3b3650', '#37324b'] },
    { name: 'The Great Hall',      r: [0, 9, 10, 18],  floor: ['#38344f', '#343049'] },
    { name: 'The Haunted Library', r: [10, 9, 20, 18], floor: ['#40344a', '#3b3046'], dark: true },
    { name: "Pip's Garden",        r: [10, 18, 20, 27], floor: ['#2f4a3c', '#2b4537'], garden: true },
    { name: "The Wizard's Tower",  r: [10, 0, 20, 9],  floor: ['#33384f', '#2f344a'] },
    { name: 'The Heart Room',      r: [20, 0, 30, 9],  floor: ['#5a3350', '#53304a'], heart: true },
  ];
  const LIBRARY = 2, GARDEN = 3, TOWER = 4, HEART = 5;
  const GATE_SPOTS = [
    { door: [5, 18], npc: [6, 19], after: [5, 17] },
    { door: [10, 13], npc: [9, 12], after: [11, 13] },
    { door: [15, 9], npc: [16, 10], after: [15, 8] },

  ];
  const OPENINGS = [[15, 18]];
  const START = [5, 24];
  const FRIEND_SPOT = [15, 22];
  const CHEST_SPOT = [25, 4];
  const MEMORY_SPOTS = [[2, 25], [2, 11], [18, 16], [12, 20], [18, 25], [12, 2], [18, 7], [12, 25], [18, 20], [8, 16]];
  const TORCHES = [[2, 18], [8, 18], [2, 9], [8, 9], [13, 9, 'library'], [17, 9, 'library'], [13, 18], [17, 18], [13, 0], [17, 0], [22, 0], [28, 0]];
  const CANDLES = [[22, 2], [28, 2], [22, 7], [28, 7]];
  const DUMMIES = [[2, 21], [8, 21], [8, 25]];
  const BRAZIERS = [[12, 11], [18, 12], [12, 16], [16, 16]];
  const POTS = [[1, 26], [9, 26], [1, 10], [9, 17], [19, 17], [11, 17], [11, 1], [19, 1], [11, 8]];
  const SLIMES = [[3, 12], [7, 15], [4, 16], [13, 4], [17, 6]];
  const WISPS = [[12, 13], [18, 14]];
  const YARN_SPOTS = [[2, 14], [6, 11], [5, 16]];

  const MAX_HP = 3;
  let grid, blocked, roomOf;
  let player, npcs, doors, memories, chest, flowers, props, enemies, yarns, stars, fireflies, berries, torches;
  let particles = [], texts = [], focus = null;
  let state = 'title', time = 0, shake = 0, flash = 0, found = 0, faintT = 0;
  let checkpoint = START, curRoom = 0, visited = new Set(), banner = { text: '', t: 0 };
  const cam = { x: 0, y: 0 };
  const idx = (x, y) => y * MW + x;
  const center = (cx, cy) => ({ cx, cy, x: cx * T + T / 2, y: cy * T + T / 2 });
  const roomAtPx = (x, y) => roomOf[idx(Math.floor(x / T), Math.floor(y / T))];

  function buildWorld() {
    grid = new Uint8Array(MW * MH).fill(VOID);
    blocked = new Uint8Array(MW * MH);
    roomOf = new Int8Array(MW * MH).fill(-1);
    ROOMS.forEach((room, ri) => {
      const [x0, y0, x1, y1] = room.r;
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const i = idx(x, y);
        if (x > x0 && x < x1 && y > y0 && y < y1) { grid[i] = FLOOR; roomOf[i] = ri; }
        else if (grid[i] !== FLOOR) grid[i] = WALL;
      }
    });
    for (const [x, y] of OPENINGS) grid[idx(x, y)] = FLOOR;

    npcs = []; doors = [];
    GATE_SPOTS.forEach((spot, gi) => {
      const gate = CONFIG.gates[gi];
      const [dx, dy] = spot.door;
      if (!gate) { grid[idx(dx, dy)] = FLOOR; return; }
      grid[idx(dx, dy)] = DOOR;
      const door = { ...center(dx, dy), gate: gi, anim: 0, opening: false, solved: false, after: spot.after };
      doors.push(door);
      const npc = { ...center(...spot.npc), name: gate.name, kind: gate.kind, cfg: gate, door, ch: { type: GATE_CHALLENGES[gi], state: 'idle', t: 0, count: 0 } };
      npcs.push(npc);
      blocked[idx(npc.cx, npc.cy)] = 1;
    });
    if (CONFIG.friend) {
      const f = { ...center(...FRIEND_SPOT), name: CONFIG.friend.name, kind: CONFIG.friend.kind, cfg: CONFIG.friend, door: null, ch: { type: 'fireflies', state: 'idle', t: 0, count: 0 } };
      npcs.push(f);
      blocked[idx(f.cx, f.cy)] = 1;
    }

    chest = { ...center(...CHEST_SPOT), opened: false, anim: 0 };
    blocked[idx(chest.cx, chest.cy)] = 1;

    props = [
      ...DUMMIES.map(p => ({ ...center(...p), type: 'dummy', broken: false })),
      ...BRAZIERS.map(p => ({ ...center(...p), type: 'brazier', lit: false })),
      ...POTS.map(p => ({ ...center(...p), type: 'pot', broken: false })),
    ];
    for (const p of props) blocked[idx(p.cx, p.cy)] = 1;

    memories = CONFIG.memories.slice(0, MEMORY_SPOTS.length).map((m, i) => ({ ...center(...MEMORY_SPOTS[i]), cfg: m, taken: false, phase: i * 1.3 }));
    found = 0;

    enemies = [
      ...SLIMES.map(p => ({ ...center(...p), type: 'slime', h: 14, vx: 0, vy: 0, hop: rand(0, 1), alive: true })),
      ...WISPS.map(p => ({ ...center(...p), type: 'wisp', h: 12, vx: 0, vy: 0, hop: 0, alive: true })),
    ];
    for (const e of enemies) e.room = roomAtPx(e.x, e.y);

    yarns = []; stars = []; berries = [];
    torches = TORCHES.map(([x, y, tag]) => ({ cx: x, cy: y, lit: tag !== 'library' }));

    // Garden flowers and fireflies (deterministic so they don't jump around between plays)
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const g = ROOMS[GARDEN].r;
    const gx = () => (g[0] + 1) * T + rnd() * (g[2] - g[0] - 1) * T;
    const gy = () => (g[1] + 1) * T + rnd() * (g[3] - g[1] - 1) * T;
    flowers = [];
    for (let k = 0; k < 34; k++) flowers.push({ x: gx(), y: gy(), c: ['#ff8fb8', '#ffd166', '#c9a7ff', '#ffffff'][(rnd() * 4) | 0] });
    fireflies = [];
    for (let k = 0; k < 7; k++) fireflies.push({ bx: clamp(gx(), (g[0] + 2) * T, (g[2] - 1) * T), by: clamp(gy(), (g[1] + 2) * T, (g[3] - 1) * T), ph: rnd() * 10, caught: false, x: 0, y: 0 });

    player = { ...center(...START), h: 16, vx: 0, vy: 0, fx: 0, fy: -1, moving: false, hp: MAX_HP, invuln: 0, dashT: 0, dashCd: 0, stepT: 0, walk: 0 };
    checkpoint = START; curRoom = 0; visited = new Set([0]);
    cam.x = player.x; cam.y = player.y;
    particles = []; texts = []; banner = { text: '', t: 0 };
  }

  const solid = (cx, cy) => {
    if (cx < 0 || cy < 0 || cx >= MW || cy >= MH) return true;

  };

  function hitsWall(x, y, h) {
    const x0 = Math.floor((x - h) / T), x1 = Math.floor((x + h - 0.001) / T);
    const y0 = Math.floor((y - h) / T), y1 = Math.floor((y + h - 0.001) / T);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) if (solid(cx, cy)) return true;
    return false;
  }

  // Moves an entity, sliding along walls. Returns which axes were blocked.
  function move(e, dx, dy) {
    let bx = false, by = false;
    if (dx) {
      const nx = e.x + dx;
      if (!hitsWall(nx, e.y, e.h)) e.x = nx;
      else {
        e.x = dx > 0 ? Math.floor((nx + e.h) / T) * T - e.h - 0.01 : (Math.floor((nx - e.h) / T) + 1) * T + e.h + 0.01;
        bx = true;
      }
    }
    if (dy) {
      const ny = e.y + dy;
      if (!hitsWall(e.x, ny, e.h)) e.y = ny;
      else {
        e.y = dy > 0 ? Math.floor((ny + e.h) / T) * T - e.h - 0.01 : (Math.floor((ny - e.h) / T) + 1) * T + e.h + 0.01;
        by = true;
      }
    }
    return { bx, by };
  }

  // Same as move(), but the entity bounces instead of leaving its home room.
  function moveInRoom(e, dx, dy) {
    const ox = e.x, oy = e.y;
    const b = move(e, dx, dy);
    if (roomAtPx(e.x, e.y) !== e.room) { e.x = ox; e.y = oy; return { bx: true, by: true }; }
    return b;
  }

  function burst(x, y, color, count = 14, speed = 200) {

  }
  function popText(x, y, text, color = '#fff') { texts.push({ x, y, text, color, life: 1.1 }); }
  function showBanner(text) { banner = { text, t: 2.4 }; }

  // ---------- Input ----------
  const keys = {};
  let isTouch = false;
  const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
  const ACT = ['KeyE', 'Space', 'Enter'];

  addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;

    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    initAudio();
    if (e.code === 'KeyM') toggleMute();
    if (e.repeat) return;
    if (state === 'play' && /^Key[A-Z]$/.test(e.code) && secretKey(e.code[3].toLowerCase())) return;
    if (state === 'wardrobe') { if (e.code === 'Escape' || e.code === 'KeyC') closeWardrobe(); return; }

      if (mv && mv.done) { if (e.code === 'Enter' || e.code === 'Space') $('mvLetter').click(); }
      else if (e.code === 'ArrowRight' || e.code === 'Space' || e.code === 'Enter') nextSlide(1);
      else if (e.code === 'ArrowLeft') nextSlide(-1);

      return;

    if (state === 'title' && (e.code === 'Enter' || e.code === 'Space')) startGame();
    else if (state === 'play' && !dlg.active && e.code === 'KeyC') openWardrobe('play');
    else if (dlg.active) dialogKey(e.code);
    else if (state === 'play') {
      if (e.code === 'KeyE' || e.code === 'Enter') interact();

  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  cv.addEventListener('touchstart', e => {
    isTouch = true; initAudio();
    for (const t of e.changedTouches) {
      if (t.clientX < VW * 0.6 && joy.id === null) { joy.id = t.identifier; joy.ox = joy.x = t.clientX; joy.oy = joy.y = t.clientY; }
      else if (state === 'play' && !dlg.active) { if (focus) interact(); else dash(); }
    }
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.x = t.clientX; joy.y = t.clientY; }
    e.preventDefault();
  }, { passive: false });
  const endTouch = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) joy.id = null; };
  cv.addEventListener('touchend', endTouch);
  cv.addEventListener('touchcancel', endTouch);

  function inputVector() {
    let x = 0, y = 0;
    if (keys.KeyD || keys.ArrowRight) x += 1;
    if (keys.KeyA || keys.ArrowLeft) x -= 1;
    if (keys.KeyS || keys.ArrowDown) y += 1;
    if (keys.KeyW || keys.ArrowUp) y -= 1;
    if (joy.id !== null) {
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
      if (d > 8) { const m = Math.min(1, d / 50); x += dx / d * m; y += dy / d * m; }
    }
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    return { x, y };
  }

  // ---------- Dialog ----------
  const dlg = { active: false, steps: [], cur: null, full: '', shown: 0, typing: false, sel: 0, onDone: null };

  function openDialog(steps, onDone) {
    dlg.active = true; dlg.steps = steps.slice(); dlg.onDone = onDone || null;
    $('dialog').classList.remove('hidden');
    nextStep();
  }

  function closeDialog(finished) {
    dlg.active = false; dlg.cur = null;
    $('dialog').classList.add('hidden');
    $('dlgInput').blur();
    const cb = dlg.onDone; dlg.onDone = null;
    if (finished && cb) cb();
  }

  function nextStep() {
    const s = dlg.steps.shift();
    if (!s) { closeDialog(true); return; }
    if (s.do) { s.do(); nextStep(); return; }
    dlg.cur = s;
    $('dlgName').textContent = fmt(s.who || '');
    $('dlgName').classList.toggle('hidden', !s.who);
    const photo = $('dlgPhoto');
    if (s.photo) { photo.src = s.photo; photo.classList.remove('hidden'); } else photo.classList.add('hidden');
    dlg.full = fmt(s.ask ? s.ask.q : s.say);
    dlg.shown = 0; dlg.typing = true;
    $('dlgText').textContent = '';
    $('dlgChoices').innerHTML = '';
    $('dlgForm').classList.add('hidden');
    $('dlgNext').classList.add('hidden');
  }

  function finishTyping() {
    dlg.typing = false;
    $('dlgText').textContent = dlg.full;
    const ask = dlg.cur.ask;
    if (!ask) { $('dlgNext').classList.remove('hidden'); return; }
    if (ask.choices) {
      dlg.sel = 0;
      const box = $('dlgChoices');
      ask.choices.forEach((c, i) => {
        const b = document.createElement('button');
        b.className = 'choice' + (i === 0 ? ' sel' : '');
        b.innerHTML = `<span class="n">${i + 1}</span>`;
        b.appendChild(document.createTextNode(fmt(c)));
        b.onclick = ev => { ev.stopPropagation(); answer(i === ask.answer); };
        box.appendChild(b);
      });
    } else {
      $('dlgForm').classList.remove('hidden');
      const inp = $('dlgInput');
      inp.value = '';
      setTimeout(() => inp.focus(), 30);
    }
  }

  function answer(correct) {
    const s = dlg.cur;
    if (correct) {
      chime([659, 880]);
      burst(player.x, player.y - 20, '#ff8fb8', 16, 180);
      if (s.ask.yay) dlg.steps.unshift({ who: s.who, say: s.ask.yay });
    } else {
      s.tries = (s.tries || 0) + 1;
      sfx(220, 0.25, 'sawtooth', 0.05, -90);
      shake = 6;
      const hint = s.ask.hint ? `\n(Hint: ${s.ask.hint})` : '';
      dlg.steps.unshift({ who: s.who, say: pick(WRONG) + hint }, s);
    }
    nextStep();
  }

  function dialogKey(code) {
    if (code === 'Escape') { closeDialog(false); return; }
    if (dlg.typing) { if (ACT.includes(code)) finishTyping(); return; }
    const ask = dlg.cur && dlg.cur.ask;
    if (!ask) { if (ACT.includes(code)) { sfx(500, 0.05, 'square', 0.03); nextStep(); } return; }
    if (!ask.choices) return;
    const n = ask.choices.length;
    if (code === 'ArrowUp' || code === 'KeyW') dlg.sel = (dlg.sel + n - 1) % n;
    else if (code === 'ArrowDown' || code === 'KeyS') dlg.sel = (dlg.sel + 1) % n;
    else if (/^Digit[1-9]$/.test(code) && +code[5] <= n) { answer(+code[5] - 1 === ask.answer); return; }
    else if (ACT.includes(code)) { answer(dlg.sel === ask.answer); return; }
    [...$('dlgChoices').children].forEach((b, i) => b.classList.toggle('sel', i === dlg.sel));
  }

  $('dlg').addEventListener('click', e => {
    if (e.target.closest('button, input, form')) return;
    if (dlg.typing) finishTyping();
    else if (dlg.cur && !dlg.cur.ask) nextStep();
  });
  $('dlgForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('dlgInput').value;
    if (!v.trim() || !dlg.cur || !dlg.cur.ask) return;
    const said = norm(v);
    answer((dlg.cur.ask.answers || []).some(a => {
      const want = norm(fmt(a));
      return want === said || want.replace(/ /g, '') === said.replace(/ /g, '') || (want.length >= 4 && ` ${said} `.includes(` ${want} `));
    }));
  });
  $('dlgInput').addEventListener('keydown', e => { if (e.code === 'Escape') closeDialog(false); });

  // ---------- Challenges ----------
  function progress(n) {
    switch (n.ch.type) {
      case 'dummies': return props.filter(p => p.type === 'dummy' && p.broken).length;
      case 'yarn': return yarns.filter(y => y.caught).length;
      case 'lanterns': return props.filter(p => p.type === 'brazier' && p.lit).length;
      case 'stars': return n.ch.count;
      case 'fireflies': return fireflies.filter(f => f.caught).length;
    }
    return 0;
  }

  function startChallenge(n) {
    const ch = n.ch, def = CHALLENGES[ch.type];
    ch.state = 'active';
    if (ch.type === 'yarn' && !yarns.length) {
      const colors = ['#ff6f9f', '#7cc6ff', '#ffd166'];
      yarns = YARN_SPOTS.map((p, i) => ({ ...center(...p), h: 11, vx: 0, vy: 0, caught: false, color: colors[i], room: 1, spin: 0 }));
    }
    if (ch.type === 'stars') { ch.t = def.time; ch.count = 0; stars = []; }
    sfx(440, 0.15, 'triangle', 0.06, 300);
  }

  function askSteps(n) {
    const who = n.name;
    return [
      ...n.cfg.questions.map(q => ({ who, ask: q, tries: 0 })),
      { who, say: n.cfg.success },
      { do: () => openDoor(n.door) },
    ];
  }

  function completeChallenge(n) {
    const def = CHALLENGES[n.ch.type];
    n.ch.state = 'done';
    stars = [];
    chime([523, 659, 784, 1046]);
    burst(player.x, player.y - 20, '#ffd166', 26, 240);
    showBanner(`${def.icon} Challenge complete!`);
    if (n.ch.type === 'lanterns') for (const t of torches) t.lit = true;
    const who = n.name;
    if (n.door) openDialog([{ who, say: def.done }, ...askSteps(n)]);
    else openDialog([{ who, say: def.done }, { who: '💚 Secret', say: n.cfg.reward || 'You are loved!' }]);
  }

  function updateChallenges(dt) {
    for (const n of npcs) {
      const ch = n.ch;
      if (!ch || ch.state !== 'active') continue;
      const def = CHALLENGES[ch.type];
      if (ch.type === 'stars') {
        ch.t -= dt;
        while (stars.length < 3) spawnStar();
        if (ch.t <= 0) {
          ch.state = 'idle'; stars = [];
          sfx(200, 0.4, 'sawtooth', 0.05, -100);
          openDialog([{ who: n.name, say: def.fail }]);
          continue;
        }
      }
      if (progress(n) >= def.goal) completeChallenge(n);
    }
  }

  function spawnStar() {
    const r = ROOMS[TOWER].r;
    for (let tries = 0; tries < 30; tries++) {
      const cx = r[0] + 1 + ((Math.random() * (r[2] - r[0] - 1)) | 0), cy = r[1] + 1 + ((Math.random() * (r[3] - r[1] - 1)) | 0);
      if (blocked[idx(cx, cy)] || stars.some(s => s.cx === cx && s.cy === cy)) continue;
      if (Math.hypot(cx * T + 32 - player.x, cy * T + 32 - player.y) < T * 1.2) continue;
      stars.push({ ...center(cx, cy), life: 3.6, born: time });
      return;
    }
  }

  // ---------- Interactions ----------
  function talk(n) {
    const who = n.name;
    const say = t => ({ who, say: t });
    const ch = n.ch, def = ch && CHALLENGES[ch.type];

    if (n.door && n.door.solved) { openDialog([say(n.cfg.after || 'The way is open. Go on! 💗')]); return; }
    if (!n.door && ch.state === 'done') { openDialog([say(n.cfg.after || 'Ribbit! Thanks again for the fireflies! 💚')]); return; }

    if (ch.state === 'idle') {
      const intro = n.met ? [] : n.cfg.lines.map(say);
      n.met = true;
      openDialog([...intro, ...def.intro.map(say), { do: () => startChallenge(n) }]);
    } else if (ch.state === 'active') {
      openDialog([say(`${def.remind}  (${progress(n)} / ${def.goal})`)]);
    } else {
      openDialog(askSteps(n));
    }
  }

  // Typing CONFIG.secretWord near the first guardian skips straight to the chest
  let typed = '';
  function secretKey(ch) {
    const word = String(CONFIG.secretWord || '').toLowerCase();
    if (!word) return false;
    typed = (typed + ch).slice(-word.length);
    const clank = npcs.find(n => n.door && n.door.gate === 0);
    if (typed !== word || !clank || Math.hypot(player.x - clank.x, player.y - clank.y) > T * 3) return false;
    typed = '';
    if (dlg.active) closeDialog(false);
    for (const d of doors) { d.solved = true; d.opening = true; checkpoint = d.after; }
    for (const n of npcs) n.ch.state = 'done';
    Object.assign(player, center(24, 4), { vx: 0, vy: 0, hp: MAX_HP, invuln: 2 });
    showBanner('🤫 Secret shortcut! Open the chest 💝');
    chime([523, 659, 784, 1046]);
    return true;
  }

  function openDoor(d) {
    d.solved = true; d.opening = true;
    checkpoint = d.after;
    sfx(90, 0.9, 'sawtooth', 0.05, 40);
    setTimeout(() => chime([523, 659, 784]), 500);
  }

  function interact() {
    if (!focus) return;
    if (focus.type === 'npc') talk(focus.o);
    else if (focus.type === 'door') talk(npcs.find(n => n.door === focus.o));
    else if (focus.type === 'chest') openChest();
  }

  function openChest() {
    if (chest.opened) return;
    chest.opened = true;
    burst(chest.x, chest.y - 30, '#ffd166', 30, 260);
    burst(chest.x, chest.y - 30, '#ff8fb8', 30, 220);
    chime([523, 659, 784, 1046, 1318]);
    shake = 8;
    setTimeout(() => { shake = 14; sfx(60, 1.2, 'sine', 0.06, 30); }, 500);
    setTimeout(startFinale, 1500);
  }

  function findFocus() {
    let best = null, bd = Infinity;
    const consider = (type, o, range) => {
      const d = Math.hypot(o.x - player.x, o.y - player.y);
      if (d < range && d < bd) { bd = d; best = { type, o }; }
    };
    for (const n of npcs) consider('npc', n, T * 1.5);
    for (const d of doors) if (!d.solved) consider('door', d, T * 1.15);
    if (!chest.opened) consider('chest', chest, T * 1.3);
    return best;
  }

  function dash() {
    const p = player;
    if (p.dashCd > 0 || state !== 'play') return;
    p.dashT = 0.16; p.dashCd = 0.55;
    p.vx = p.fx * 820; p.vy = p.fy * 820;
    shake = Math.max(shake, 3);
    sfx(260, 0.14, 'sawtooth', 0.035, 420);
  }

  function hurt(src) {
    const p = player;
    p.hp--; p.invuln = 1.3; flash = 0.35; shake = 12;
    const l = Math.hypot(p.x - src.x, p.y - src.y) || 1;
    p.vx = (p.x - src.x) / l * 520; p.vy = (p.y - src.y) / l * 520;
    burst(p.x, p.y, '#ff6f9f', 14, 220);
    sfx(300, 0.3, 'sawtooth', 0.07, -220);
    if (p.hp <= 0) { state = 'faint'; faintT = 0; }
  }

  function smash(o) {
    o.broken = true;
    blocked[idx(o.cx, o.cy)] = 0;
    shake = Math.max(shake, 7);
    const color = o.type === 'dummy' ? '#e0b060' : '#c46b3f';
    burst(o.x, o.y - 10, color, 20, 260);
    sfx(150, 0.18, 'square', 0.06, -70);
    if (o.type === 'pot') {
      if (Math.random() < 0.55) berries.push({ x: o.x, y: o.y, t: 0 });
      else popText(o.x, o.y - 30, pick(['✨', '💫', '🌟']));
    } else popText(o.x, o.y - 40, 'SMASH!', '#ffd166');
  }

  function pop(e) {
    e.alive = false;
    burst(e.x, e.y - 8, e.type === 'slime' ? '#5fd3c8' : '#a8d8ff', 18, 240);
    sfx(700, 0.12, 'square', 0.05, 500);
    popText(e.x, e.y - 30, pick(['POP!', 'BOING!', 'Bye~']), '#a8fff4');
    shake = Math.max(shake, 5);
    if (Math.random() < 0.3) berries.push({ x: e.x, y: e.y, t: 0 });
  }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    shake = Math.max(0, shake - dt * 30);
    flash = Math.max(0, flash - dt);
    if (banner.t > 0) banner.t -= dt;

    if (dlg.active && dlg.typing) {
      const before = Math.floor(dlg.shown);
      dlg.shown += dt * 42;
      const now = Math.floor(dlg.shown);
      if (now !== before) {
        $('dlgText').textContent = dlg.full.slice(0, now);
        if (now % 3 === 0) sfx(rand(520, 640), 0.03, 'square', 0.012);
      }
      if (dlg.shown >= dlg.full.length) finishTyping();
    }

    const live = state === 'play' && !dlg.active;
    updatePlayer(dt, live);
    if (live) {
      updateEnemies(dt);
      updateYarn(dt);
      updatePickups(dt);
      updateChallenges(dt);
    }
    for (const f of fireflies) {
      f.x = f.bx + Math.sin(time * 0.9 + f.ph) * 80 + Math.sin(time * 2.3 + f.ph * 2) * 20;
      f.y = f.by + Math.cos(time * 0.7 + f.ph * 1.3) * 60;
    }

    for (const d of doors) {
      if (!d.opening) continue;
      d.anim = Math.min(1, d.anim + dt / 0.9);
      shake = Math.max(shake, 3);
      if (Math.random() < 0.5) particles.push({ x: d.x + rand(-28, 28), y: d.y + 24, vx: rand(-30, 30), vy: rand(-60, -20), life: 0.6, max: 0.6, color: '#8a7a6a', size: rand(4, 8) });
      if (d.anim >= 1) { d.opening = false; grid[idx(d.cx, d.cy)] = FLOOR; }
    }
    if (chest.opened) chest.anim = Math.min(1, chest.anim + dt * 2);

    if (state === 'faint') {
      faintT += dt;
      if (faintT > 1.4) {
        const p = player;
        Object.assign(p, center(...checkpoint), { hp: MAX_HP, invuln: 2, vx: 0, vy: 0 });
        cam.x = p.x; cam.y = p.y;
        state = 'play';
        showBanner('Love revives you! 💗');
        chime([523, 784]);
      }
    }

    focus = live ? findFocus() : null;

    for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92; q.life -= dt; }
    particles = particles.filter(q => q.life > 0);
    for (const t of texts) { t.y -= 40 * dt; t.life -= dt; }
    texts = texts.filter(t => t.life > 0);

    const c = 1 - Math.exp(-7 * dt);
    cam.x += (player.x - cam.x) * c;
    cam.y += (player.y - cam.y) * c;
  }

  function updatePlayer(dt, live) {
    const p = player;
    const inp = live ? inputVector() : { x: 0, y: 0 };
    p.moving = Math.hypot(inp.x, inp.y) > 0.1;
    if (p.moving) p.walk += dt * 13;
    if (p.moving) { const l = Math.hypot(inp.x, inp.y); p.fx = inp.x / l; p.fy = inp.y / l; }
    p.dashCd = Math.max(0, p.dashCd - dt);
    p.invuln = Math.max(0, p.invuln - dt);

    if (p.dashT > 0) {
      p.dashT -= dt;
      particles.push({ x: p.x + rand(-6, 6), y: p.y + rand(-6, 6), vx: 0, vy: 0, life: 0.25, max: 0.25, color: '#ffc2da', size: 10 });
    } else {
      const k = 1 - Math.exp(-14 * dt);
      p.vx += (inp.x * 250 - p.vx) * k;
      p.vy += (inp.y * 250 - p.vy) * k;
    }
    move(p, p.vx * dt, p.vy * dt);

    if (p.moving && p.dashT <= 0) {
      p.stepT -= dt;
      if (p.stepT <= 0) {
        p.stepT = 0.16;
        particles.push({ x: p.x + rand(-6, 6), y: p.y + p.h, vx: rand(-15, 15), vy: rand(-25, -5), life: 0.35, max: 0.35, color: 'rgba(200,190,230,.5)', size: rand(3, 5) });
      }
    }
    if (!live) return;

    // Smash pots and dummies by dashing into them; light lanterns by touching them.
    for (const o of props) {
      const near = Math.abs(o.x - p.x) < T / 2 + p.h + 6 && Math.abs(o.y - p.y) < T / 2 + p.h + 6;
      if (!near) continue;
      if (o.type === 'brazier') {
        if (!o.lit) {
          o.lit = true;
          burst(o.x, o.y - 30, '#ff9b3d', 20, 160);
          sfx(330, 0.3, 'triangle', 0.06, 330);
          popText(o.x, o.y - 50, '🔥', '#ff9b3d');
        }
      } else if (!o.broken && p.dashT > 0) smash(o);
    }

    const ri = roomAtPx(p.x, p.y);
    if (ri >= 0 && ri !== curRoom) {
      curRoom = ri;
      if (!visited.has(ri)) { visited.add(ri); showBanner(ROOMS[ri].name); }
    }
  }

  function updateEnemies(dt) {
    const p = player;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
      const sameRoom = curRoom === e.room;
      if (e.type === 'slime') {
        e.hop -= dt;
        if (e.hop <= 0) {
          e.hop = rand(0.8, 1.3);
          let a = Math.random() * Math.PI * 2;
          if (sameRoom && d < 280) a = Math.atan2(dy, dx) + rand(-0.4, 0.4);
          const s = rand(200, 250);
          e.vx = Math.cos(a) * s; e.vy = Math.sin(a) * s;
        }
        e.vx *= Math.exp(-4 * dt); e.vy *= Math.exp(-4 * dt);
      } else {
        const s = sameRoom ? 55 : 0;
        e.vx = dx / d * s + Math.sin(time * 2 + e.cx) * 20;
        e.vy = dy / d * s + Math.cos(time * 1.7 + e.cy) * 20;
      }
      const vx = e.vx, vy = e.vy;
      const b = moveInRoom(e, e.vx * dt, e.vy * dt);
      if (b.bx) e.vx = -vx * 0.6;
      if (b.by) e.vy = -vy * 0.6;

      if (Math.abs(dx) < e.h + p.h - 2 && Math.abs(dy) < e.h + p.h - 2) {
        if (p.dashT > 0) pop(e);
        else if (p.invuln <= 0 && state === 'play') hurt(e);
      }
    }
  }

  function updateYarn(dt) {
    const p = player;
    for (const y of yarns) {
      if (y.caught) continue;
      const dx = y.x - p.x, dy = y.y - p.y, d = Math.hypot(dx, dy) || 1;
      if (d < 170) { y.vx += dx / d * 1100 * dt; y.vy += dy / d * 1100 * dt; }
      const sp = Math.hypot(y.vx, y.vy);
      if (sp > 200) { y.vx *= 200 / sp; y.vy *= 200 / sp; }
      y.vx *= Math.exp(-2.5 * dt); y.vy *= Math.exp(-2.5 * dt);
      y.spin += sp * dt * 0.05;
      const vx = y.vx, vy = y.vy;
      const b = moveInRoom(y, y.vx * dt, y.vy * dt);
      if (b.bx) y.vx = -vx * 0.8;
      if (b.by) y.vy = -vy * 0.8;
      if (d < 30) {
        y.caught = true;
        burst(y.x, y.y - 10, y.color, 16, 180);
        chime([880, 1175]);
        const n = npcs.find(m => m.ch.type === 'yarn');
        popText(y.x, y.y - 30, `🧶 ${progress(n)}/3`, '#ffd166');
      }
    }
  }

  function updatePickups(dt) {
    const p = player;
    for (const m of memories) {
      if (m.taken || Math.hypot(m.x - p.x, m.y - p.y) > 34) continue;
      m.taken = true; found++;
      burst(m.x, m.y - 24, '#ff8fb8', 22, 200);
      chime([784, 988, 1175]);
      openDialog([{ who: `💗 Memory ${found}/${memories.length}`, say: m.cfg.text, photo: m.cfg.photo }]);
      return;
    }
    for (let i = berries.length - 1; i >= 0; i--) {
      const b = berries[i];
      b.t += dt;
      if (b.t > 0.4 && Math.hypot(b.x - p.x, b.y - p.y) < 30) {
        berries.splice(i, 1);
        if (p.hp < MAX_HP) { p.hp++; popText(b.x, b.y - 30, '+1 ♥', '#ff6f9f'); } else popText(b.x, b.y - 30, 'Yum!', '#ff6f9f');
        sfx(660, 0.12, 'triangle', 0.06, 300);
      }
    }
    const sn = npcs.find(m => m.ch.type === 'stars');
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.life -= dt;
      if (Math.hypot(s.x - p.x, s.y - p.y) < 34) {
        stars.splice(i, 1);
        sn.ch.count++;
        burst(s.x, s.y - 20, '#ffd166', 14, 200);
        sfx(880 + sn.ch.count * 40, 0.12, 'triangle', 0.06, 300);
      } else if (s.life <= 0) stars.splice(i, 1);
    }
    for (const f of fireflies) {
      if (f.caught || Math.hypot(f.x - p.x, f.y - 20 - p.y) > 30) continue;
      f.caught = true;
      burst(f.x, f.y - 20, '#e8ff8a', 12, 150);
      sfx(1200, 0.1, 'triangle', 0.05, 400);
      popText(f.x, f.y - 40, '✨', '#e8ff8a');
    }
  }

  // ---------- Drawing helpers ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }
  // A block seen from above at a slant: footprint (x,y,w,d), standing h tall.
  function block(x, y, w, d, h, top, side, r = 0) {
    ctx.fillStyle = side; rr(x, y + d - h - r, w, h + r, r); ctx.fill();
    ctx.fillStyle = top; rr(x, y - h, w, d, r); ctx.fill();
  }
  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s * 0.3);
    ctx.bezierCurveTo(x - s / 2, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s / 2, y + s * 0.6, x + s / 2, y + s * 0.3);
    ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * 0.3);
  }
  function starPath(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
    }
    ctx.closePath();
  }
  function shadow(x, y, r) {
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.45, 0, 0, Math.PI * 2); ctx.fill();
  }
  function eyes(cx, cy, fx, fy, gap = 6) {
    for (const s of [-1, 1]) {
      const ex = cx + s * gap + fx * 3, ey = cy + fy * 2.5;
      ctx.fillStyle = '#fff'; ctx.fillRect(ex - 3.5, ey - 4, 7, 8);
      ctx.fillStyle = '#1b1530'; ctx.fillRect(ex - 2 + fx * 1.5, ey - 2 + fy * 1.5, 4, 4);
    }
  }
  function flame(x, y, s, seed) {
    const f = Math.sin(time * 18 + seed * 3) * 2;
    ctx.fillStyle = '#ff9b3d';
    ctx.beginPath(); ctx.ellipse(x, y, (6 + f * 0.3) * s, (10 + f) * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe08a';
    ctx.beginPath(); ctx.ellipse(x, y + 3 * s, 3 * s, (5 + f * 0.5) * s, 0, 0, Math.PI * 2); ctx.fill();
  }

  const WALL_H = 34;
  function drawWall(cx, cy, torch) {
    const x = cx * T, y = cy * T;
    ctx.fillStyle = '#2a2638'; ctx.fillRect(x, y + T - WALL_H, T, WALL_H);
    ctx.fillStyle = '#231f30';
    ctx.fillRect(x, y + T - WALL_H + 11, T, 2); ctx.fillRect(x, y + T - WALL_H + 22, T, 2);
    ctx.fillRect(x + ((cx % 2) ? 20 : 44), y + T - WALL_H, 2, 11);
    ctx.fillStyle = '#4b4562'; ctx.fillRect(x, y - WALL_H, T, T);
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
    ctx.strokeRect(x + 3, y - WALL_H + 3, T - 6, T - 6);
    if (torch) {
      const tx = x + T / 2, ty = y + T - 20;
      ctx.fillStyle = '#5a3a22'; ctx.fillRect(tx - 3, ty - 4, 6, 12);
      if (torch.lit) flame(tx, ty - 10, 1, cx);
    }
  }

  function drawDoor(d) {
    const h = 44 * (1 - d.anim), x = d.cx * T, y = d.cy * T;
    if (h <= 0.5) return;
    ctx.fillStyle = '#5d3a1e'; ctx.fillRect(x + 2, y + T - h, T - 4, h);
    ctx.fillStyle = '#4a2d16';
    for (let i = 1; i < 4; i++) ctx.fillRect(x + 2 + i * (T - 4) / 4, y + T - h, 2, h);
    ctx.fillStyle = '#8a5a2e'; ctx.fillRect(x + 2, y - h, T - 4, T);
    ctx.fillStyle = '#3a3a48'; ctx.fillRect(x + 2, y - h + 14, T - 4, 5); ctx.fillRect(x + 2, y - h + T - 20, T - 4, 5);
    if (h > 14) {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(x + T / 2, y + T - h / 2 - 2, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5d3a1e'; ctx.fillRect(x + T / 2 - 1.5, y + T - h / 2 - 3, 3, 6);
    }
  }

  function drawProp(o) {
    const x = o.x, y = o.y;
    if (o.type === 'pot') {
      if (o.broken) return;
      block(x - 16, y - 12, 32, 30, 18, '#d07a4a', '#8f4528', 10);
      ctx.fillStyle = '#5a2a16'; ctx.beginPath(); ctx.ellipse(x, y - 24, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'dummy') {
      if (o.broken) {
        ctx.fillStyle = '#6b4a2a'; ctx.fillRect(x - 4, y - 4, 8, 12);
        ctx.fillStyle = '#c9a35a'; ctx.fillRect(x - 14, y + 4, 28, 5);
        return;
      }
      ctx.fillStyle = '#6b4a2a'; ctx.fillRect(x - 4, y - 30, 8, 40);
      ctx.fillStyle = '#c9a35a'; ctx.fillRect(x - 20, y - 26, 40, 7);
      ctx.fillStyle = '#e0b866'; ctx.beginPath(); ctx.arc(x, y - 42, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e5484d'; ctx.beginPath(); ctx.arc(x, y - 42, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y - 42, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e5484d'; ctx.beginPath(); ctx.arc(x, y - 42, 2, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'brazier') {
      block(x - 18, y - 14, 36, 32, 22, '#6d6880', '#46425a', 6);
      ctx.fillStyle = '#231f30'; ctx.beginPath(); ctx.ellipse(x, y - 21, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
      if (o.lit) flame(x, y - 32, 1.5, o.cx + o.cy);
    }
  }

  const NPC_COLORS = {
    knight: ['#c3cad6', '#808a9a'], cat: ['#f6a75b', '#c97a33'], ghost: ['#f4f2ff', '#c8c3e6'],
    wizard: ['#7c5cff', '#5236c9'], frog: ['#6fd36a', '#3f9a3b'],
  };

  function drawNpc(n) {
    const h = 21, H = 16;
    const ghost = n.kind === 'ghost';
    const bob = ghost ? 8 + Math.sin(time * 2.5 + n.cx) * 4 : Math.abs(Math.sin(time * 2 + n.cx)) * 1.5;
    const x0 = n.x - h, y0 = n.y - h - bob;
    const [top, side] = NPC_COLORS[n.kind] || NPC_COLORS.knight;
    const l = Math.hypot(player.x - n.x, player.y - n.y) || 1;
    const fx = (player.x - n.x) / l, fy = (player.y - n.y) / l;
    const tx = n.x, ty = y0 - H + h;
    if (ghost) ctx.globalAlpha = 0.88;
    block(x0, y0, h * 2, h * 2, H, top, side, 7);

    switch (n.kind) {
      case 'knight':
        ctx.fillStyle = '#2b2f3a'; ctx.fillRect(tx - 14, ty - 5, 28, 8);
        ctx.fillStyle = '#9fe0ff'; ctx.fillRect(tx - 8 + fx * 3, ty - 3, 4, 4); ctx.fillRect(tx + 4 + fx * 3, ty - 3, 4, 4);
        ctx.fillStyle = '#e5484d';
        ctx.beginPath(); ctx.ellipse(tx, y0 - H - 4, 6, 10, 0, 0, Math.PI * 2); ctx.fill();
        break;
      case 'cat':
        ctx.fillStyle = top;
        for (const s of [-1, 1]) {
          ctx.beginPath(); ctx.moveTo(tx + s * 18, y0 - H + 3); ctx.lineTo(tx + s * 6, y0 - H + 3); ctx.lineTo(tx + s * 14, y0 - H - 10); ctx.fill();
        }
        eyes(tx, ty - 3, fx, fy);
        ctx.fillStyle = '#ff7aa2'; ctx.fillRect(tx - 2, ty + 5, 4, 3);
        ctx.strokeStyle = '#5a3a22'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (const s of [-1, 1]) { ctx.moveTo(tx + s * 6, ty + 7); ctx.lineTo(tx + s * 17, ty + 5); ctx.moveTo(tx + s * 6, ty + 9); ctx.lineTo(tx + s * 17, ty + 11); }
        ctx.stroke();
        break;
      case 'ghost':
        ctx.fillStyle = '#2b2440';
        for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(tx + s * 7 + fx * 2, ty - 2 + fy * 2, 3.5, 5, 0, 0, Math.PI * 2); ctx.fill(); }
        ctx.beginPath(); ctx.ellipse(tx, ty + 9, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
        break;
      case 'wizard':
        eyes(tx, ty - 2, fx, fy);
        ctx.fillStyle = '#f4f1ff'; rr(tx - 10, ty + 4, 20, 16, 6); ctx.fill();
        ctx.fillStyle = '#4b2fa8';
        ctx.beginPath(); ctx.moveTo(tx - 19, y0 - H + 8); ctx.lineTo(tx + 19, y0 - H + 8); ctx.lineTo(tx + 5, y0 - H - 30); ctx.fill();
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.arc(tx + 2, y0 - H - 8, 3.5, 0, Math.PI * 2); ctx.fill();
        break;
      case 'frog':
        for (const s of [-1, 1]) {
          ctx.fillStyle = top; ctx.beginPath(); ctx.arc(tx + s * 9, y0 - H + 2, 8, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(tx + s * 9, y0 - H + 1, 5.5, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#1b1530'; ctx.beginPath(); ctx.arc(tx + s * 9 + fx * 2, y0 - H + 1 + fy * 2, 2.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.strokeStyle = '#1f5a1d'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(tx, ty + 2, 9, 0.2, Math.PI - 0.2); ctx.stroke();
        break;
    }
    ctx.globalAlpha = 1;

    const waiting = n.door ? !n.door.solved : n.ch.state !== 'done';
    if (waiting && !(focus && (focus.o === n || focus.o === n.door))) {
      const mark = n.ch.state === 'active' ? '…' : n.ch.state === 'done' ? '!' : '?';
      bubble(tx, y0 - H - (n.kind === 'wizard' ? 40 : 22) - Math.abs(Math.sin(time * 3)) * 4, mark, '#ffd166');
    }
  }

  function drawEnemy(e) {
    if (e.type === 'slime') {
      const sq = Math.min(1, Math.hypot(e.vx, e.vy) / 220);
      const w = 30 + (1 - sq) * 4, hgt = 10 + sq * 8, x0 = e.x - w / 2, y0 = e.y - 12 - sq * 6;
      block(x0, y0, w, 26, hgt, '#6fe3d6', '#2f9c93', 10);
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x0 + 8, y0 - hgt + 6, 4, 3, -0.5, 0, Math.PI * 2); ctx.fill();
      const l = Math.hypot(player.x - e.x, player.y - e.y) || 1;
      eyes(e.x, y0 - hgt + 14, (player.x - e.x) / l, (player.y - e.y) / l, 5);
    } else {
      const bob = Math.sin(time * 3 + e.cx) * 4, y = e.y - 26 + bob;
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = '#a8d8ff';
      ctx.beginPath(); ctx.arc(e.x, y, 13, Math.PI, 0);
      ctx.lineTo(e.x + 13, y + 12);
      for (let i = 0; i < 4; i++) ctx.lineTo(e.x + 13 - (i + 0.5) * 6.5, y + 12 + (i % 2 ? 5 : -2) + Math.sin(time * 8 + i) * 2);
      ctx.lineTo(e.x - 13, y + 12); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#1b2a4a';
      ctx.beginPath(); ctx.ellipse(e.x - 5, y - 1, 2.5, 4, 0, 0, Math.PI * 2); ctx.ellipse(e.x + 5, y - 1, 2.5, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawYarn(y) {
    const cy = y.y - 10;
    ctx.fillStyle = y.color;
    ctx.beginPath(); ctx.arc(y.x, cy, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.ellipse(y.x, cy, 11, 4 + i * 2.5, y.spin + i * 1.1, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawStar(s) {
    if (s.life < 1 && Math.floor(time * 10) % 2) return;
    const drop = Math.max(0, 1 - (time - s.born) * 4) * 120;
    ctx.fillStyle = '#ffd166';
    starPath(s.x, s.y - 26 - drop + Math.sin(time * 4 + s.cx) * 3, 14); ctx.fill();
    ctx.fillStyle = '#fff3c4';
    starPath(s.x, s.y - 26 - drop + Math.sin(time * 4 + s.cx) * 3, 6); ctx.fill();
  }

  function drawBerry(b) {
    const y = b.y - 14 - Math.abs(Math.sin(time * 4 + b.x)) * 4;
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath(); ctx.moveTo(b.x - 9, y - 4); ctx.quadraticCurveTo(b.x, y - 10, b.x + 9, y - 4); ctx.quadraticCurveTo(b.x + 6, y + 10, b.x, y + 12); ctx.quadraticCurveTo(b.x - 6, y + 10, b.x - 9, y - 4); ctx.fill();
    ctx.fillStyle = '#5fd36a'; ctx.fillRect(b.x - 6, y - 9, 12, 4);
    ctx.fillStyle = '#ffe08a';
    for (const [ox, oy] of [[-3, 0], [3, 1], [0, 5]]) ctx.fillRect(b.x + ox - 1, y + oy - 1, 2, 2);
  }

  function bubble(x, y, text, color) {
    ctx.font = 'bold 16px Fredoka, system-ui, sans-serif';
    const w = Math.max(24, ctx.measureText(text).width + 14);
    ctx.fillStyle = 'rgba(20,16,34,.9)'; rr(x - w / 2, y - 14, w, 24, 8); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y - 1);
    ctx.textBaseline = 'alphabetic';
  }

  function drawPlayer() {
    const p = player;
    if (p.invuln > 0 && Math.floor(time * 14) % 2 === 0) return;
    ctx.save();
    ctx.translate(p.x, p.y + p.h - 1);
    if (p.dashT > 0) { ctx.shadowColor = '#ffc2da'; ctx.shadowBlur = 16; }
    ctx.scale(1.3, 1.3);
    drawGirl(ctx, look, { fx: p.fx, fy: p.fy, phase: p.moving ? p.walk : time * 4, moving: p.moving });
    ctx.restore();
  }

  function drawChest() {
    const w = 46, x0 = chest.x - w / 2, y0 = chest.y - w / 2 + 4, H = 20;
    ctx.fillStyle = '#7a4f22'; ctx.fillRect(x0, y0 + w - H, w, H);
    ctx.fillStyle = '#ffd166'; ctx.fillRect(x0, y0 + w - H + 6, w, 4);
    if (!chest.opened) {
      ctx.fillStyle = '#b07a3c'; rr(x0, y0 - H, w, w, 6); ctx.fill();
      ctx.fillStyle = '#ffd166'; ctx.fillRect(chest.x - 3, y0 - H, 6, w);
      ctx.fillRect(chest.x - 6, y0 + w - H - 4, 12, 10);
    } else {
      ctx.fillStyle = '#3a2210'; ctx.fillRect(x0 + 4, y0 - H + 18, w - 8, w - 22);
      ctx.fillStyle = '#ffe9a8'; ctx.globalAlpha = 0.6 + Math.sin(time * 5) * 0.2;
      ctx.fillRect(x0 + 6, y0 - H + 20, w - 12, w - 26); ctx.globalAlpha = 1;
      const lift = 26 * chest.anim;
      ctx.fillStyle = '#b07a3c'; rr(x0, y0 - H - lift, w, 20, 6); ctx.fill();
      ctx.fillStyle = '#ffd166'; ctx.fillRect(chest.x - 3, y0 - H - lift, 6, 20);
    }
    if (!chest.opened && !(focus && focus.o === chest)) {
      ctx.fillStyle = '#ffd166'; ctx.globalAlpha = 0.6 + Math.sin(time * 4) * 0.4;
      ctx.font = '18px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('✨', chest.x + 22, y0 - H - 8);
      ctx.globalAlpha = 1;
    }
  }

  function drawMemory(m) {
    const bob = Math.sin(time * 3 + m.phase) * 4;
    ctx.fillStyle = '#ff6f9f';
    heartPath(m.x, m.y - 38 + bob, 22); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.arc(m.x - 5, m.y - 31 + bob, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- Render ----------
  const torchAt = new Map();

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0d0a16'; ctx.fillRect(0, 0, VW, VH);

    const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
    const ox = VW / 2 - (cam.x + sx) * zoom, oy = VH / 2 - (cam.y + sy) * zoom;
    ctx.setTransform(DPR * zoom, 0, 0, DPR * zoom, ox * DPR, oy * DPR);

    const halfW = VW / 2 / zoom, halfH = VH / 2 / zoom;
    const x0 = Math.max(0, Math.floor((cam.x - halfW) / T) - 1), x1 = Math.min(MW - 1, Math.floor((cam.x + halfW) / T) + 1);
    const y0 = Math.max(0, Math.floor((cam.y - halfH) / T) - 1), y1 = Math.min(MH - 1, Math.floor((cam.y + halfH) / T) + 2);

    // Floor
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      const i = idx(cx, cy);
      if (grid[i] === WALL || grid[i] === VOID) continue;
      let ri = roomOf[i];
      if (ri < 0) ri = roomOf[idx(cx, cy + 1)] >= 0 ? roomOf[idx(cx, cy + 1)] : roomOf[idx(cx + 1, cy)];
      const room = ROOMS[ri] || ROOMS[0];
      ctx.fillStyle = room.floor[(cx + cy) % 2];
      ctx.fillRect(cx * T, cy * T, T, T);
      ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
      ctx.strokeRect(cx * T + 0.5, cy * T + 0.5, T - 1, T - 1);
    }

    // Heart room rug, garden flowers, candles
    const hr = ROOMS[HEART].r;
    ctx.fillStyle = '#b2416f'; rr((hr[0] + 2) * T, (hr[1] + 2) * T, (hr[2] - hr[0] - 3) * T, (hr[3] - hr[1] - 3) * T, 16); ctx.fill();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3; ctx.stroke();
    for (const f of flowers) {
      ctx.fillStyle = f.c;
      for (let a = 0; a < 4; a++) { ctx.beginPath(); ctx.arc(f.x + Math.cos(a * 1.57) * 4, f.y + Math.sin(a * 1.57) * 4, 3, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(f.x, f.y, 2, 0, Math.PI * 2); ctx.fill();
    }
    for (const [cx, cy] of CANDLES) {
      const x = cx * T + T / 2, y = cy * T + T / 2;
      ctx.fillStyle = '#fff3e0'; ctx.fillRect(x - 4, y - 14, 8, 16);
      ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.ellipse(x, y - 19, 3, 5 + Math.sin(time * 15 + cx) * 1, 0, 0, Math.PI * 2); ctx.fill();
    }

    // Shadows
    for (const m of memories) if (!m.taken) shadow(m.x, m.y - 4, 9);
    for (const n of npcs) shadow(n.x, n.y + 18, 22);
    for (const e of enemies) if (e.alive) shadow(e.x, e.y + 12, 15);
    for (const y of yarns) if (!y.caught) shadow(y.x, y.y + 2, 10);
    for (const s of stars) shadow(s.x, s.y + 4, 10);
    shadow(player.x, player.y + player.h - 2, player.h + 3);

    // Depth-sorted objects
    torchAt.clear();
    for (const t of torches) torchAt.set(idx(t.cx, t.cy), t);
    const list = [];
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
      const i = idx(cx, cy);
      if (grid[i] === WALL) list.push({ y: cy * T + T, f: () => drawWall(cx, cy, torchAt.get(i)) });
    }
    for (const d of doors) list.push({ y: d.cy * T + T, f: () => drawDoor(d) });
    for (const o of props) list.push({ y: o.y + 18, f: () => drawProp(o) });
    for (const n of npcs) list.push({ y: n.y + 21, f: () => drawNpc(n) });
    for (const e of enemies) if (e.alive) list.push({ y: e.y + 14, f: () => drawEnemy(e) });
    for (const y of yarns) if (!y.caught) list.push({ y: y.y + 11, f: () => drawYarn(y) });
    for (const m of memories) if (!m.taken) list.push({ y: m.y + 1, f: () => drawMemory(m) });
    for (const s of stars) list.push({ y: s.y + 1, f: () => drawStar(s) });
    for (const b of berries) list.push({ y: b.y + 1, f: () => drawBerry(b) });
    list.push({ y: chest.y + 27, f: drawChest });
    list.push({ y: player.y + player.h, f: drawPlayer });
    list.sort((a, b) => a.y - b.y);
    for (const d of list) d.f();

    for (const f of fireflies) {
      if (f.caught) continue;
      const a = 0.6 + Math.sin(time * 6 + f.ph) * 0.4;
      ctx.fillStyle = `rgba(232,255,138,${a})`;
      ctx.beginPath(); ctx.arc(f.x, f.y - 20, 4, 0, Math.PI * 2); ctx.fill();
    }

    for (const q of particles) {
      ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2 - 10, q.size, q.size);
    }

      const o = focus.o;
      const label = isTouch ? 'Tap' : 'E';

      bubble(o.x, o.y - lift - Math.abs(Math.sin(time * 4)) * 3, label, '#ff8fb8');

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  function drawFog(ox, oy) {
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.globalCompositeOperation = 'source-over';
    fctx.clearRect(0, 0, fog.width, fog.height);
    fctx.fillStyle = 'rgba(6,3,14,.9)';
    fctx.fillRect(0, 0, fog.width, fog.height);
    fctx.globalCompositeOperation = 'destination-out';
    const s = DPR * zoom;
    const cut = (wx, wy, r, a) => {
      const x = (wx * zoom + ox) * DPR, y = (wy * zoom + oy) * DPR, R = r * s;
      if (x < -R || y < -R || x > fog.width + R || y > fog.height + R) return;
      const g = fctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, `rgba(0,0,0,${a})`);
      g.addColorStop(0.55, `rgba(0,0,0,${a * 0.7})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      fctx.fillStyle = g;
      fctx.fillRect(x - R, y - R, R * 2, R * 2);
    };
    const warm = [];
    const libDark = curRoom === LIBRARY && npcs.some(n => n.ch.type === 'lanterns' && n.ch.state !== 'done');
    cut(player.x, player.y, libDark ? 160 : 250, 1);
    for (const t of torches) if (t.lit) { const x = t.cx * T + T / 2, y = t.cy * T + T + 12; cut(x, y, 210 * (1 + Math.sin(time * 9 + x) * 0.04), 0.9); warm.push([x, y]); }
    for (const [cx, cy] of CANDLES) { const x = cx * T + T / 2, y = cy * T + T / 2; cut(x, y, 150, 0.8); warm.push([x, y]); }
    for (const o of props) if (o.type === 'brazier' && o.lit) { cut(o.x, o.y - 20, 240 * (1 + Math.sin(time * 9 + o.x) * 0.05), 0.95); warm.push([o.x, o.y]); }
    const room = (r, rad, a) => cut((r.r[0] + r.r[2]) / 2 * T + T / 2, (r.r[1] + r.r[3]) / 2 * T + T / 2, rad, a);
    room(ROOMS[GARDEN], 360, 0.45);
    room(ROOMS[HEART], 380, 0.5);
    for (const m of memories) if (!m.taken) cut(m.x, m.y - 30, 90, 0.7);
    for (const n of npcs) cut(n.x, n.y, 110, 0.5);
    for (const f of fireflies) if (!f.caught) cut(f.x, f.y - 20, 55, 0.7);
    for (const st of stars) cut(st.x, st.y - 26, 80, 0.8);
    for (const e of enemies) if (e.alive && e.type === 'wisp') cut(e.x, e.y - 26, 70, 0.6);
    cut(chest.x, chest.y, chest.opened ? 320 : 140, 0.8);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(fog, 0, 0);

    // Warm glow on top of torches and candles
    ctx.globalCompositeOperation = 'lighter';
    for (const [wx, wy] of warm) {
      const x = (wx * zoom + ox) * DPR, y = (wy * zoom + oy) * DPR, R = 120 * s;
      if (x < -R || y < -R || x > cv.width + R || y > cv.height + R) continue;
      const g = ctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, 'rgba(255,140,60,.13)');
      g.addColorStop(1, 'rgba(255,140,60,0)');
      ctx.fillStyle = g; ctx.fillRect(x - R, y - R, R * 2, R * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawHud() {
    const solved = doors.filter(d => d.solved).length;
    ctx.fillStyle = 'rgba(20,16,34,.75)'; rr(12, 12, 150, 92, 12); ctx.fill();
    ctx.textAlign = 'left'; ctx.font = '600 17px Fredoka, system-ui, sans-serif';

    ctx.fillStyle = '#ffd166'; ctx.fillText(`🗝️  ${solved} / ${doors.length}`, 24, 92);

    // Active challenge tracker
    const active = npcs.find(n => n.ch.state === 'active');
    if (active) {
      const def = CHALLENGES[active.ch.type];
      let msg = `${def.icon} ${def.label}  ${progress(active)} / ${def.goal}`;

      ctx.font = '600 18px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center';

    if (banner.t > 0) {

    if (isTouch) {
      if (joy.id !== null) {
        ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, Math.PI * 2); ctx.stroke();

    let hint = '';

      const verb = focus.type === 'chest' ? 'open the chest' : 'talk';

    g.quadraticCurveTo(0, bot + 1.6, -wBot, bot);
    g.quadraticCurveTo(-wBot * 0.9, (top + bot) / 2, -wTop, top);
    g.closePath();

    if (!pat) return;

      const ox = ((y - top) / 3.6) % 2 ? 2.1 : 0;
      if (patKind === 'flowers') tinyFlower(g, x + ox, y, 0.75, pat);

        g.fillStyle = '#fff'; g.beginPath(); g.moveTo(-2.5, -31); g.lineTo(2.5, -31); g.lineTo(0, -26); g.closePath(); g.fill();
        for (let i = 0; i < 3; i++) dot(g, 0, -25 + i * 2.6, 0.7, '#ffd166');
        g.strokeStyle = dark(o.c); g.lineWidth = 0.5; g.beginPath(); g.moveTo(0, -26); g.lineTo(0, -18.5); g.stroke();
        break;
      }
      case 'frills': {
        arms(g, skin, null, 0, swing);
        puffSleeves(g, o.c);
        skirt(g, -21, -8, 7.5, 12, o.c);
        g.strokeStyle = o.c2; g.lineWidth = 0.9;
        for (const [y, w] of [[-16, 9.5], [-11.5, 11], [-8.2, 12]]) {
          g.beginPath(); g.moveTo(-w, y);
          for (let k = 0; k < 6; k++) g.quadraticCurveTo(-w + (k + 0.5) * w / 3, y + 1.6, -w + (k + 1) * w / 3, y);
          g.stroke();
        }
        g.fillStyle = o.c; rrg(g, -7.5, -31, 15, 11, 3); g.fill();
        g.fillStyle = o.c2;
        g.beginPath(); g.moveTo(0, -28); g.lineTo(-3.5, -30.5); g.lineTo(-3.5, -25.5); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(0, -28); g.lineTo(3.5, -30.5); g.lineTo(3.5, -25.5); g.closePath(); g.fill();
        dot(g, 0, -28, 1.1, o.c2);
        break;
      }
    }
  }

  // Bag drawn centred on (0,0), roughly 12 units wide.
  function drawBag(g, b, sway = 0) {
    if (!b || b.kind === undefined) return;
    g.save(); g.rotate(sway);
    const gold = '#e8b84a', dk = shade(b.c, -35);
    switch (b.kind) {
      case 'samo': {
        g.strokeStyle = dk; g.lineWidth = 1.1; g.beginPath(); g.arc(0, -3.5, 3.2, Math.PI, 0); g.stroke();
        g.fillStyle = b.c;
        g.beginPath(); g.moveTo(-6, -3); g.quadraticCurveTo(-7, 5, 0, 5); g.quadraticCurveTo(7, 5, 6, -3); g.quadraticCurveTo(0, -5, -6, -3); g.fill();
        g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(-2.5, -0.5, 1.6, 2.6, -0.4, 0, Math.PI * 2); g.fill();
        g.fillStyle = shade(b.c, -60);
        g.beginPath(); g.moveTo(0, 0); g.lineTo(-3, -1.6); g.lineTo(-3, 1.6); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(0, 0); g.lineTo(3, -1.6); g.lineTo(3, 1.6); g.closePath(); g.fill();
        dot(g, 0, 0, 0.9, shade(b.c, -60));
        break;
      }
      case 'tabby':
      case 'pillow': {
        const pillow = b.kind === 'pillow';
        g.fillStyle = b.c; rrg(g, -6.5, -4.5, 13, 9, pillow ? 4 : 1.6); g.fill();
        if (pillow) {
          g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(-2, -2.2, 4, 1.4, 0, 0, Math.PI * 2); g.fill();
          g.strokeStyle = dk; g.lineWidth = 0.5; g.beginPath(); g.moveTo(-5.5, 0.5); g.quadraticCurveTo(0, 1.8, 5.5, 0.5); g.stroke();
        } else {
          g.strokeStyle = dk; g.lineWidth = 0.6; g.beginPath(); g.moveTo(-6.5, -0.5); g.quadraticCurveTo(0, 1.5, 6.5, -0.5); g.stroke();
        }
        g.strokeStyle = gold; g.lineWidth = 1; g.beginPath(); g.arc(0, 0.6, 1.5, 0.7, Math.PI * 2 - 0.7); g.stroke();
        if (b.charm) {
          g.strokeStyle = '#3f8f45'; g.lineWidth = 0.5; g.beginPath(); g.moveTo(5, -3); g.lineTo(6, 2); g.moveTo(5, -3); g.lineTo(8, 2); g.stroke();
          dot(g, 6, 3, 1.4, '#e5243b'); dot(g, 8.2, 3, 1.4, '#e5243b');
        }
        break;
      }
      case 'swinger': {
        g.fillStyle = b.c;
        g.beginPath(); g.moveTo(-6.5, -3); g.lineTo(6.5, -3); g.quadraticCurveTo(7, 4, 0, 4); g.quadraticCurveTo(-7, 4, -6.5, -3); g.fill();
        g.strokeStyle = dk; g.lineWidth = 0.6; g.beginPath(); g.moveTo(-6.4, -1.5); g.quadraticCurveTo(0, 0.5, 6.4, -1.5); g.stroke();
        g.strokeStyle = gold; g.lineWidth = 0.9; g.beginPath(); g.arc(0, 0.5, 1.2, 0.7, Math.PI * 2 - 0.7); g.stroke();
        break;
      }
      case 'lady': {
        const s = b.size || 1;
        g.scale(s, s);
        g.strokeStyle = shade(b.c, b.c === '#1f1a24' ? 60 : -30); g.lineWidth = 1.2;
        g.beginPath(); g.arc(-2, -4, 2.8, Math.PI, 0); g.stroke();
        g.beginPath(); g.arc(2, -4, 2.8, Math.PI, 0); g.stroke();
        g.fillStyle = b.c;
        g.beginPath(); g.moveTo(-5.5, -4); g.lineTo(5.5, -4); g.lineTo(6.5, 5); g.lineTo(-6.5, 5); g.closePath(); g.fill();
        g.save(); g.clip();
        g.strokeStyle = b.c === '#1f1a24' ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.14)'; g.lineWidth = 0.4;
        for (let k = -14; k <= 14; k += 2.6) { g.beginPath(); g.moveTo(k, -5); g.lineTo(k + 10, 6); g.stroke(); g.beginPath(); g.moveTo(k, 6); g.lineTo(k + 10, -5); g.stroke(); }
        g.restore();
        g.strokeStyle = gold; g.lineWidth = 0.5; g.beginPath(); g.moveTo(4.6, -4); g.lineTo(5.2, -1.5); g.stroke();
        const ch = [[4.2, -0.8], [5.4, -0.2], [6.6, -0.8], [5.8, 0.8]];
        for (const [x, y] of ch) { g.fillStyle = gold; g.fillRect(x - 0.6, y - 0.6, 1.2, 1.2); }
        break;
      }
    }
    g.restore();
  }

  function drawShoe(g, s, x, lift, skin) {
    const y = -lift;
    switch (s.kind) {
      case 'maryjane':
        g.fillStyle = '#fff'; g.fillRect(x - 2.3, y - 5.5, 4.6, 3);
        g.fillStyle = s.c; rrg(g, x - 3, y - 3, 6, 3.2, 1.5); g.fill();
        g.strokeStyle = s.c; g.lineWidth = 0.9; g.beginPath(); g.moveTo(x - 2.4, y - 3.8); g.lineTo(x + 2.4, y - 3.8); g.stroke();
        dot(g, x + 1.6, y - 3.8, 0.6, '#ffd166');
        break;
      case 'sneaker':
        g.fillStyle = '#fff'; rrg(g, x - 3.2, y - 3.6, 6.4, 3.8, 1.8); g.fill();
        g.fillStyle = '#e2dde8'; g.fillRect(x - 3.2, y - 0.9, 6.4, 1);
        g.fillStyle = '#ff8fb8'; g.fillRect(x - 1.5, y - 2.8, 3, 0.8);
        break;
      case 'flats':
        g.fillStyle = s.c; rrg(g, x - 2.8, y - 2.4, 5.6, 2.6, 1.3); g.fill();
        dot(g, x, y - 2.2, 0.8, shade(s.c, -40));
        break;
      case 'sandals':
        g.fillStyle = skin; rrg(g, x - 2.6, y - 2.4, 5.2, 2.4, 1); g.fill();
        g.fillStyle = shade(s.c, -40); g.fillRect(x - 3, y - 0.6, 6, 0.8);
        g.strokeStyle = s.c; g.lineWidth = 0.8; g.beginPath(); g.moveTo(x - 2.4, y - 1.8); g.lineTo(x + 2.4, y - 1.8); g.moveTo(x - 2, y - 4); g.lineTo(x + 2, y - 4); g.stroke();
        break;
      case 'loafer':
        g.fillStyle = '#fff'; g.fillRect(x - 2.3, y - 6, 4.6, 3);
        g.fillStyle = '#1b1418'; g.fillRect(x - 3.3, y - 1.8, 6.6, 1.8);
        g.fillStyle = s.c; rrg(g, x - 3, y - 4.2, 6, 2.8, 1.2); g.fill();
        g.fillStyle = '#ffd166'; g.fillRect(x - 1.2, y - 3.6, 2.4, 0.6);
        break;
      case 'boots':
        g.fillStyle = s.c; rrg(g, x - 2.9, y - 8, 5.8, 8.2, 1.6); g.fill();
        g.fillStyle = '#fff'; rrg(g, x - 3.3, y - 9, 6.6, 2.6, 1.3); g.fill();
        dot(g, x, y - 7.8, 0.8, '#ff8fb8');
        break;
      case 'guoc':
        g.fillStyle = skin; rrg(g, x - 2.6, y - 3.4, 5.2, 2.2, 1); g.fill();
        g.fillStyle = '#b07a3c'; rrg(g, x - 3.2, y - 1.8, 6.4, 1.9, 0.6); g.fill();
        g.fillStyle = s.c; rrg(g, x - 2.9, y - 3.6, 5.8, 1.6, 0.8); g.fill();
        tinyFlower(g, x, y - 2.8, 0.45, '#fff');
        break;
    }
  }

  function drawHairBack(g, style, c) {
    g.fillStyle = c;
    switch (style) {
      case 'long': rrg(g, -13.2, -50, 26.4, 33, 9); g.fill(); break;
      case 'wavy':
        rrg(g, -13.6, -50, 27.2, 30, 9); g.fill();
        for (let i = 0; i < 5; i++) dot(g, -11 + i * 5.5, -20.5, 3, c);
        break;
      case 'pony':
        g.beginPath(); g.ellipse(11, -36, 4, 11, 0.25, 0, Math.PI * 2); g.fill();
        break;
      case 'buns': dot(g, -9.5, -52, 5, c); dot(g, 9.5, -52, 5, c); break;
      case 'bob': rrg(g, -13.8, -52, 27.6, 21, 8); g.fill(); break;
    }
  }

  function drawHat(g, h, c, back) {
    switch (h) {
      case 'nonla':
        g.fillStyle = '#e9d29a';
        g.beginPath(); g.moveTo(-19, -47); g.lineTo(0, -63); g.lineTo(19, -47); g.quadraticCurveTo(0, -44.5, -19, -47); g.fill();
        g.strokeStyle = '#c9ab66'; g.lineWidth = 0.5;
        for (let i = 1; i < 4; i++) { const k = i / 4; g.beginPath(); g.moveTo(-19 * k, -63 + 16 * k); g.lineTo(19 * k, -63 + 16 * k); g.stroke(); }
        if (!back) g.strokeStyle = '#ff6f9f'; else break;
        g.lineWidth = 0.8; g.beginPath(); g.moveTo(-11, -46); g.quadraticCurveTo(-6, -32, 0, -31); g.quadraticCurveTo(6, -32, 11, -46); g.stroke();
        break;
      case 'crown':
        for (let i = 0; i < 7; i++) {
          const a = Math.PI + 0.35 + i * (Math.PI - 0.7) / 6;
          tinyFlower(g, Math.cos(a) * 12.5, -42 + Math.sin(a) * 12.5, 1.3, ['#ff8fb8', '#fff', '#ffd166', '#c9a7ff'][i % 4], i % 4 === 2 ? '#fff' : '#ffd166');
        }
        dot(g, -10, -49, 1, '#5fbf4f'); dot(g, 10, -49, 1, '#5fbf4f');
        break;
      case 'bow':
        g.fillStyle = '#ff4f93';
        g.beginPath(); g.moveTo(5, -53); g.lineTo(-1, -58); g.lineTo(-1, -49); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(5, -53); g.lineTo(11, -58); g.lineTo(11, -49); g.closePath(); g.fill();
        dot(g, 5, -53, 1.8, '#e5245f');
        break;
      case 'sunhat':
        g.fillStyle = '#f3e2b5'; g.beginPath(); g.ellipse(0, -50, 19, 5, 0, 0, Math.PI * 2); g.fill();
        rrg(g, -9, -59, 18, 10, 5); g.fill();
        g.fillStyle = '#ff8fb8'; g.fillRect(-9, -53, 18, 2.4);
        tinyFlower(g, 7, -52, 1.2, '#fff');
        break;
      case 'clips':
        for (const [x, y] of [[-7, -47], [7.5, -48]]) {
          g.fillStyle = '#ff4f93';
          g.beginPath(); g.moveTo(x, y + 1); g.bezierCurveTo(x - 2.4, y - 1.2, x - 1.2, y - 2.6, x, y - 1.2); g.bezierCurveTo(x + 1.2, y - 2.6, x + 2.4, y - 1.2, x, y + 1); g.fill();
        }
        break;
    }
  }

  // The player character. Origin is between her feet; about 60 units tall.
  function drawGirl(g, L, o = {}) {
    const skin = SKINS[L.skin] || SKINS[0], hair = (HAIR_COLORS[L.hairColor] || HAIR_COLORS[0])[1];
    const out = byId(OUTFITS, L.outfit), bag = byId(BAGS, L.bag), shoe = byId(SHOES, L.shoes);
    const fx = o.fx || 0, fy = o.fy || 0, ph = o.phase || 0, mv = !!o.moving;
    const back = fy < -0.5 && Math.abs(fx) < 0.7;
    const flip = fx < -0.3 ? -1 : 1;
    const bob = mv ? Math.abs(Math.sin(ph)) * 1.4 : Math.sin(ph * 0.25) * 0.4;
    const lift = mv ? [Math.max(0, Math.sin(ph)) * 2.4, Math.max(0, -Math.sin(ph)) * 2.4] : [0, 0];
    const swing = mv ? Math.sin(ph) * 1.2 : 0;

    g.save(); g.scale(flip, 1);
    if (!back) drawHairBack(g, L.hair, hair);

    for (const [i, x] of [[0, -3.8], [1, 3.8]]) {
      g.fillStyle = skin; rrg(g, x - 2, -15 - lift[i], 4, 14, 1.8); g.fill();
      drawShoe(g, shoe, x, lift[i], skin);
    }

    g.translate(0, -bob);
    g.fillStyle = skin; g.fillRect(-2, -33, 4, 3);
    drawOutfit(g, out, skin, swing);

    if (bag.kind) {
      const by = bag.kind === 'swinger' ? -26 : -20;
      g.strokeStyle = bag.kind === 'lady' ? '#c9a14a' : shade(bag.c, -40); g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(-5.5, -31); g.quadraticCurveTo(4, -26, 11, by - 4); g.stroke();
      g.save(); g.translate(11.5, by); drawBag(g, bag, mv ? Math.sin(ph + 1) * 0.12 : 0); g.restore();
    }

    // head
    g.fillStyle = skin; g.beginPath(); g.arc(0, -42, 12, 0, Math.PI * 2); g.fill();
    if (back) {
      drawHairBack(g, L.hair, hair);
      g.fillStyle = hair; g.beginPath(); g.arc(0, -42.5, 12.8, 0, Math.PI * 2); g.fill();
    } else {
      const ex = Math.abs(fx) * 1.4, ey = fy * 0.9;
      for (const s of [-1, 1]) {
        g.fillStyle = '#2b2230'; g.beginPath(); g.ellipse(s * 4.6 + ex, -39 + ey, 2.1, 2.8, 0, 0, Math.PI * 2); g.fill();
        dot(g, s * 4.6 + ex + 0.7, -40 + ey, 0.8, '#fff');
        g.fillStyle = 'rgba(255,110,150,.4)'; g.beginPath(); g.ellipse(s * 7.6, -35, 2.2, 1.3, 0, 0, Math.PI * 2); g.fill();
      }
      g.strokeStyle = '#b5124a'; g.lineWidth = 0.8; g.beginPath(); g.arc(ex * 0.6, -35.2, 1.6, 0.2, Math.PI - 0.2); g.stroke();
      // bangs
      g.fillStyle = hair;
      g.beginPath(); g.arc(0, -42.5, 12.8, Math.PI, 0);
      const side = L.hair === 'bob' || L.hair === 'long' || L.hair === 'wavy' ? -34 : -39;
      g.lineTo(12.8, side); g.lineTo(10.5, side);
      g.quadraticCurveTo(9.5, -44, 6, -45); g.quadraticCurveTo(3, -42, 0.5, -45.5); g.quadraticCurveTo(-3, -42, -6, -45);
      g.quadraticCurveTo(-9.5, -44, -10.5, side); g.lineTo(-12.8, side); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 1.2; g.beginPath(); g.arc(0, -42.5, 10, Math.PI * 1.2, Math.PI * 1.45); g.stroke();
      if (L.hair === 'braids') for (const s of [-1, 1]) for (let i = 0; i < 5; i++) dot(g, s * (11 + i * 0.3), -36 + i * 3.4, 2.4 - i * 0.15, hair);
      if (L.hair === 'pony') dot(g, 9, -50, 1.6, '#ff6f9f');
    }
    drawHat(g, L.hat, hair, back);
    g.restore();
  }

  // ---------- Wardrobe screen ----------
  const WD_TABS = [
    { id: 'outfit', label: '👗 Outfit', list: OUTFITS },
    { id: 'bag', label: '👜 Bag', list: BAGS },
    { id: 'shoes', label: '👠 Shoes', list: SHOES },
    { id: 'hair', label: '💇‍♀️ Hair', list: HAIRS },
    { id: 'hat', label: '🎀 Hat', list: HATS },
  ];
  let wdTab = 'outfit', wdReturn = 'play', wdSpark = 0;

  function thumb(tab, item) {
    const c = document.createElement('canvas'), S = 72;
    c.width = c.height = S * DPR; c.style.width = c.style.height = S + 'px';
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (tab === 'bag') {
      if (!item.kind) { g.font = '28px system-ui'; g.textAlign = 'center'; g.fillText('🚫', 36, 46); return c; }
      g.translate(36, 38); g.scale(3.6, 3.6); drawBag(g, item);
    } else if (tab === 'shoes') {
      g.translate(36, 52); g.scale(4, 4);
      const skin = SKINS[look.skin];
      for (const x of [-3.8, 3.8]) { g.fillStyle = skin; rrg(g, x - 2, -9, 4, 8, 1.8); g.fill(); drawShoe(g, item, x, 0, skin); }
    } else {
      const L = { ...look, [tab]: item.id };
      if (tab === 'outfit') { g.translate(36, 70); g.scale(1.05, 1.05); }
      else if (tab === 'hair') { g.translate(36, 36 + 36 * 1.5); g.scale(1.5, 1.5); }
      else { g.translate(36, 36 + 48 * 1.6); g.scale(1.6, 1.6); }
      drawGirl(g, L);
    }
    return c;
  }

  function openWardrobe(from) {
    wdReturn = from;
    state = 'wardrobe';
    overlay.classList.remove('clear');
    showOverlay(`<div class="wardrobe">
      <h2>Dress up 💄</h2>
      <div class="wd-body">
        <div class="wd-preview"><canvas id="wdPreview"></canvas><div class="wd-name" id="wdName"></div></div>
        <div class="wd-side">
          <div class="wd-tabs" id="wdTabs"></div>
          <div class="wd-swatches" id="wdSwatches"></div>
          <div class="wd-grid" id="wdGrid"></div>
        </div>
      </div>
      <div class="wd-actions">
        <button class="btn alt" id="wdRandom">🎲 Surprise me</button>
        <button class="btn" id="wdDone">${from === 'start' ? "Let's go! ✨" : 'Done ✨'}</button>
      </div>
    </div>`);
    const pv = $('wdPreview');
    pv.width = 220 * DPR; pv.height = 270 * DPR;
    $('wdTabs').innerHTML = WD_TABS.map(t => `<button class="wd-tab" data-tab="${t.id}">${t.label}</button>`).join('');
    $('wdTabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { wdTab = b.dataset.tab; renderWardrobe(); } };
    $('wdRandom').onclick = () => {
      look = { skin: look.skin, hairColor: (Math.random() * HAIR_COLORS.length) | 0, hair: pick(HAIRS).id, hat: pick(HATS).id, outfit: pick(OUTFITS).id, bag: pick(BAGS.slice(1)).id, shoes: pick(SHOES).id };
      saveLook(); wdSpark = 1; chime([659, 880, 1046]); renderWardrobe();
    };
    $('wdDone').onclick = closeWardrobe;
    renderWardrobe();
  }

  function renderWardrobe() {
    for (const b of $('wdTabs').children) b.classList.toggle('on', b.dataset.tab === wdTab);
    const tab = WD_TABS.find(t => t.id === wdTab);
    const key = tab.id;
    const sw = $('wdSwatches');
    sw.innerHTML = '';
    if (key === 'hair') {
      const row = (label, items, cur, set) => {
        const r = document.createElement('div'); r.className = 'wd-row';
        r.innerHTML = `<span>${label}</span>`;
        items.forEach((c, i) => {
          const b = document.createElement('button');
          b.className = 'wd-sw' + (i === cur ? ' on' : ''); b.style.background = c; b.title = label;
          b.onclick = () => { set(i); saveLook(); wdSpark = 1; sfx(880, 0.08, 'triangle', 0.05, 200); renderWardrobe(); };
          r.appendChild(b);
        });
        sw.appendChild(r);
      };
      row('Skin', SKINS, look.skin, i => look.skin = i);
      row('Color', HAIR_COLORS.map(h => h[1]), look.hairColor, i => look.hairColor = i);
    }
    const grid = $('wdGrid');
    grid.innerHTML = '';
    for (const item of tab.list) {
      const b = document.createElement('button');
      b.className = 'wd-item' + (look[key] === item.id ? ' on' : '');
      b.appendChild(thumb(key, item));
      const s = document.createElement('span'); s.textContent = item.name; b.appendChild(s);
      b.onclick = () => { look[key] = item.id; saveLook(); wdSpark = 1; sfx(880, 0.08, 'triangle', 0.05, 200); renderWardrobe(); };
      grid.appendChild(b);
    }
    $('wdName').textContent = `${byId(OUTFITS, look.outfit).name}\n${byId(BAGS, look.bag).name}`;
  }

  function drawWardrobePreview(dt) {
    const pv = $('wdPreview');
    if (!pv) return;
    const g = pv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, pv.width, pv.height);
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(110, 246, 46, 9, 0, 0, Math.PI * 2); g.fill();
    g.save(); g.translate(110, 246); g.scale(3.5, 3.5);
    drawGirl(g, look, { phase: time * 4 });
    g.restore();
    if (wdSpark > 0) {
      wdSpark = Math.max(0, wdSpark - dt * 1.5);
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + time, r = 70 + (1 - wdSpark) * 40;
        g.globalAlpha = wdSpark; g.fillStyle = i % 2 ? '#ffd166' : '#ff8fb8';

  function boomSound() {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const len = actx.sampleRate * 1.6;
    const buf = actx.createBuffer(1, len, actx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = actx.createBufferSource(), lp = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(80, t + 1.4);
    g.gain.setValueAtTime(0.5, t);
    src.connect(lp).connect(g).connect(actx.destination);
    src.start(t);

  const PINKS = ['#ff6f9f', '#ff8fb8', '#ffb3c7', '#e5487a', '#ffc8d9', '#f7559a'];

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);

  }

  // Lays out the bouquet: wrap, leaves, flowers (outside in, hero rose last), baby's breath.
  function makeBouquet() {
    const S = Math.min(VW / 560, VH / 760, 1.25);
    const cx = VW / 2, cy = VH * 0.44;
    const B = { S, cx, cy, tie: { x: cx, y: cy + 200 * S }, tip: { x: cx, y: cy + 285 * S }, rx: 175 * S, ry: 118 * S };

    B.rx = 190 * S; B.ry = 128 * S;
    const N = 40;
    const spots = [];
    for (let i = 1; i <= N; i++) {
      const r = Math.sqrt(i / N), a = i * 2.39996;
      let x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (y > 0.35) y = 0.35 + (y - 0.35) * 0.4; // flatter bottom so it sits in the wrap
      y -= (1 - x * x) * 0.12; // domed top
      spots.push({ x: cx + x * B.rx, y: cy + y * B.ry, r });
    }
    spots.sort((a, b) => b.r - a.r);
    const types = ['rose', 'peony', 'rose', 'hydrangea', 'rose', 'peony', 'tulip', 'rose', 'daisy', 'rose'];
    B.flowers = spots.map((p, i) => {
      const type = types[i % types.length];
      return {
        ...p, type, rot: rand(0, 6),
        size: (type === 'daisy' ? 26 : type === 'hydrangea' ? 34 : 36 + (1 - p.r) * 12) * S * rand(0.9, 1.1),
        c: type === 'daisy' ? '#ffffff' : Math.random() < 0.85 ? pick(PINKS) : pick(ACCENTS),
        t0: 1.8 + i * 0.075,
      };
    });
    // A back row peeking out over the top
    for (let i = 0; i < 13; i++) {
      const a = Math.PI * (1.08 + i / 12 * 0.84);
      const type = i % 3 === 1 ? 'tulip' : i % 3 === 2 ? 'hydrangea' : 'rose';
      B.flowers.push({ x: cx + Math.cos(a) * B.rx * 0.98, y: cy + Math.sin(a) * B.ry * 1.12 - 6 * S, r: 1.1, type, rot: rand(0, 6),
        size: (type === 'hydrangea' ? 28 : 30) * S * rand(0.9, 1.1), c: Math.random() < 0.85 ? pick(PINKS) : pick(ACCENTS), t0: 1.55 + i * 0.05 });
    }
    // Little buds and florets tucked into the gaps
    for (let i = 0; i < 26; i++) {
      const a = rand(0, Math.PI * 2), r = Math.sqrt(rand(0.05, 1)) * 1.02;
      const type = i % 2 ? 'bud' : 'floret';
      B.flowers.push({ x: cx + Math.cos(a) * B.rx * r, y: cy + Math.min(Math.sin(a), 0.45) * B.ry * r - (1 - Math.cos(a) ** 2) * 0.1 * B.ry, r, type, rot: rand(-0.6, 0.6),
        size: rand(13, 18) * S, c: type === 'floret' ? pick(['#ffffff', '#ffe1ea', '#ffc8d9']) : pick(PINKS), t0: 3.4 + i * 0.03, quiet: true });
    }
    B.flowers.sort((a, b) => a.t0 - b.t0);
    const last = B.flowers[B.flowers.length - 1].t0;
    B.flowers.push({ x: cx, y: cy - 14 * S, r: 0, type: 'rose', rot: 0.5, size: 62 * S, c: '#ff5c93', t0: last + 0.4, hero: true });
    B.done = B.flowers[B.flowers.length - 1].t0 + 0.5;
    // draw from top to bottom so the lower (nearer) blooms overlap
    B.order = [...B.flowers].sort((a, b) => a.y - b.y);

    B.leaves = [];
    for (let i = 0; i < 15; i++) {
      const a = Math.PI + 0.05 + i / 14 * (Math.PI - 0.1);
      B.leaves.push({ a, x: cx + Math.cos(a) * B.rx * 1.08, y: cy + Math.sin(a) * B.ry * 1.16, len: rand(34, 52) * S, t0: 1.3 + Math.abs(i - 7) * 0.05, euc: i % 3 === 0 });
    }
    B.breath = [];
    for (let i = 0; i < 30; i++) {
      const a = rand(0, Math.PI * 2), r = rand(0.6, 1.15);
      B.breath.push({ x: cx + Math.cos(a) * B.rx * r, y: cy + Math.min(Math.sin(a), 0.4) * B.ry * r, t0: 3.2 + i * 0.05, dots: Array.from({ length: 6 }, () => [rand(-9, 9) * S, rand(-9, 9) * S]) });
    }
    B.sparkles = Array.from({ length: 22 }, () => ({ x: cx + rand(-1.5, 1.5) * B.rx, y: cy + rand(-1.6, 1.3) * B.ry, ph: rand(0, 6), s: rand(4, 9) * S }));
    return B;
  }

  function showSlide(i) {
    const ph = mv.slides[i], dur = (MV.secondsPerPhoto || 5) + 1.5;
    const el = document.createElement('div');
    el.className = 'mv-slide' + (i % 2 ? ' alt' : '');

  function nextSlide(step) {

  function firework(x, y, n = 60, heart = false) {
    const c1 = pick(PINKS), c2 = Math.random() < 0.5 ? '#ffd166' : '#ffffff';
    for (let i = 0; i < n; i++) {
      let vx, vy;
      if (heart) {
        const a = i / n * Math.PI * 2, s = rand(15, 17);
        vx = 16 * Math.pow(Math.sin(a), 3) * s;
        vy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * s;
      } else {
        const a = Math.random() * Math.PI * 2, s = rand(120, 420);
        vx = Math.cos(a) * s; vy = Math.sin(a) * s;
      }
      fin.sparks.push({ x, y, vx, vy, life: rand(1.1, 1.7), max: 1.7, c: Math.random() < 0.6 ? c1 : c2, heart });
    }
    if (fin.t > 0) sfx(rand(90, 140), 0.5, 'sawtooth', 0.04, -60);
  }

  const easeOut = k => 1 - Math.pow(1 - k, 3);
  const easeBack = k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);

  function fxHeart(x, y, s) {
    fx.beginPath();
    fx.moveTo(x, y + s * 0.3);
    fx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s * 0.3);
    fx.bezierCurveTo(x - s / 2, y + s * 0.6, x, y + s * 0.8, x, y + s);
    fx.bezierCurveTo(x, y + s * 0.8, x + s / 2, y + s * 0.6, x + s / 2, y + s * 0.3);
    fx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * 0.3);
  }
  function twinkle(x, y, s, a) {
    fx.globalAlpha = a;
    fx.fillStyle = '#fff';
    fx.beginPath();
    fx.moveTo(x, y - s); fx.quadraticCurveTo(x, y, x + s, y); fx.quadraticCurveTo(x, y, x, y + s);
    fx.quadraticCurveTo(x, y, x - s, y); fx.quadraticCurveTo(x, y, x, y - s);
    fx.fill();
    fx.globalAlpha = 1;
  }

  function drawBloom(f, r) {
    fx.save();
    fx.rotate(f.rot + Math.sin(time * 1.2 + f.rot) * 0.05);
    fx.fillStyle = 'rgba(80,10,40,.18)';
    fx.beginPath(); fx.arc(2, 4, r * 0.95, 0, Math.PI * 2); fx.fill();
    if (f.type === 'rose') {
      fx.fillStyle = shade(f.c, -30);
      for (let i = 0; i < 5; i++) { const a = i * 1.2566; fx.beginPath(); fx.arc(Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42, r * 0.58, 0, Math.PI * 2); fx.fill(); }
      fx.fillStyle = f.c; fx.beginPath(); fx.arc(0, 0, r * 0.72, 0, Math.PI * 2); fx.fill();
      fx.fillStyle = shade(f.c, 18); fx.beginPath(); fx.arc(r * 0.04, -r * 0.02, r * 0.46, 0, Math.PI * 2); fx.fill();
      fx.strokeStyle = shade(f.c, -45); fx.lineWidth = Math.max(1.5, r * 0.07); fx.lineCap = 'round';
      fx.beginPath(); fx.arc(0, 0, r * 0.55, 0.3, 0.3 + Math.PI * 1.1); fx.stroke();
      fx.beginPath(); fx.arc(r * 0.05, 0, r * 0.34, 2.2, 2.2 + Math.PI * 1.25); fx.stroke();
      fx.beginPath(); fx.arc(0, r * 0.03, r * 0.16, 4.1, 4.1 + Math.PI * 1.4); fx.stroke();
    } else if (f.type === 'peony') {
      fx.fillStyle = shade(f.c, -20);
      for (let i = 0; i < 9; i++) { const a = i * 0.698; fx.beginPath(); fx.arc(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, r * 0.45, 0, Math.PI * 2); fx.fill(); }
      fx.fillStyle = f.c;
      for (let i = 0; i < 6; i++) { const a = i * 1.047 + 0.4; fx.beginPath(); fx.arc(Math.cos(a) * r * 0.28, Math.sin(a) * r * 0.28, r * 0.36, 0, Math.PI * 2); fx.fill(); }
      fx.fillStyle = shade(f.c, 25);
      for (let i = 0; i < 4; i++) { const a = i * 1.57; fx.beginPath(); fx.arc(Math.cos(a) * r * 0.1, Math.sin(a) * r * 0.1, r * 0.17, 0, Math.PI * 2); fx.fill(); }
    } else if (f.type === 'tulip') {
      fx.rotate(-f.rot);
      fx.fillStyle = f.c;
      fx.beginPath();
      fx.moveTo(-r * 0.75, -r * 0.2);
      fx.quadraticCurveTo(-r * 0.85, r * 0.85, 0, r * 0.8);
      fx.quadraticCurveTo(r * 0.85, r * 0.85, r * 0.75, -r * 0.2);
      fx.lineTo(r * 0.42, -r * 0.85); fx.lineTo(r * 0.15, -r * 0.3); fx.lineTo(0, -r * 0.95); fx.lineTo(-r * 0.15, -r * 0.3); fx.lineTo(-r * 0.42, -r * 0.85);
      fx.closePath(); fx.fill();
      fx.fillStyle = 'rgba(255,255,255,.3)';
      fx.beginPath(); fx.ellipse(-r * 0.3, r * 0.1, r * 0.14, r * 0.38, 0.2, 0, Math.PI * 2); fx.fill();
    } else if (f.type === 'hydrangea') {
      for (let i = 0; i < 11; i++) {
        const a = i * 2.4, d = Math.sqrt(i / 11) * r * 0.72, x = Math.cos(a) * d, y = Math.sin(a) * d;
        fx.fillStyle = i % 2 ? f.c : shade(f.c, 22);
        for (let j = 0; j < 4; j++) { const b = j * 1.5708 + i; fx.beginPath(); fx.arc(x + Math.cos(b) * r * 0.13, y + Math.sin(b) * r * 0.13, r * 0.15, 0, Math.PI * 2); fx.fill(); }
        fx.fillStyle = shade(f.c, -40); fx.beginPath(); fx.arc(x, y, r * 0.04, 0, Math.PI * 2); fx.fill();
      }
    } else if (f.type === 'bud') {
      fx.fillStyle = f.c;
      fx.beginPath(); fx.moveTo(0, -r); fx.quadraticCurveTo(r * 0.9, -r * 0.1, 0, r * 0.6); fx.quadraticCurveTo(-r * 0.9, -r * 0.1, 0, -r); fx.fill();
      fx.strokeStyle = shade(f.c, -40); fx.lineWidth = Math.max(1, r * 0.1);
      fx.beginPath(); fx.moveTo(0, -r * 0.6); fx.quadraticCurveTo(r * 0.3, -r * 0.1, 0, r * 0.3); fx.stroke();
      fx.fillStyle = '#4c9a4f';
      for (const sd of [-1, 1]) { fx.beginPath(); fx.moveTo(0, r * 0.75); fx.quadraticCurveTo(sd * r * 0.6, r * 0.35, sd * r * 0.25, -r * 0.1); fx.quadraticCurveTo(sd * r * 0.1, r * 0.4, 0, r * 0.75); fx.fill(); }
    } else if (f.type === 'floret') {
      fx.fillStyle = f.c;
      for (let i = 0; i < 5; i++) { const a = i * 1.2566; fx.beginPath(); fx.arc(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45, r * 0.42, 0, Math.PI * 2); fx.fill(); }
      fx.fillStyle = '#ff8fb8'; fx.beginPath(); fx.arc(0, 0, r * 0.25, 0, Math.PI * 2); fx.fill();
    } else {
      fx.fillStyle = f.c;
      for (let i = 0; i < 12; i++) { const a = i * 0.5236; fx.beginPath(); fx.ellipse(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, r * 0.5, r * 0.17, a, 0, Math.PI * 2); fx.fill(); }

    }
    fx.restore();
  }

  function drawLeaf(l, k) {
    const len = l.len * easeBack(k);
    fx.save();
    fx.translate(l.x, l.y); fx.rotate(l.a + Math.sin(time * 1.3 + l.a * 3) * 0.06);
    if (l.euc) {
      fx.strokeStyle = '#6f9f83'; fx.lineWidth = 2;
      fx.beginPath(); fx.moveTo(-10, 0); fx.lineTo(len, 0); fx.stroke();
      fx.fillStyle = '#9cc7a8';
      for (let i = 0; i < 4; i++) { fx.beginPath(); fx.arc(len * (0.25 + i * 0.22), (i % 2 ? -1 : 1) * 6 * fin.B.S, 7 * fin.B.S * k, 0, Math.PI * 2); fx.fill(); }
    } else {
      fx.fillStyle = '#4fae5a';
      fx.beginPath(); fx.moveTo(-10, 0); fx.quadraticCurveTo(len * 0.5, -len * 0.32, len, 0); fx.quadraticCurveTo(len * 0.5, len * 0.32, -10, 0); fx.fill();

    fx.restore();
  }

  function drawBouquet(t) {
    const B = fin.B, S = B.S, cx = B.cx, cy = B.cy;

    // Wrap: back sheet fans out behind the flowers
    const w = easeBack(clamp((t - 1.0) / 0.7, 0, 1));
    if (w > 0) {
      fx.save();
      fx.translate(B.tip.x, B.tip.y); fx.scale(w, w); fx.translate(-B.tip.x, -B.tip.y);
      fx.fillStyle = '#fde4ec';
      fx.beginPath();
      fx.moveTo(B.tip.x, B.tip.y);
      fx.lineTo(cx - 245 * S, cy - 70 * S);
      for (let i = 0; i <= 6; i++) {
        const x = cx - 245 * S + i * (490 * S / 6), y = cy - 80 * S - (i % 2 ? 38 : 8) * S - Math.sin(i / 6 * Math.PI) * 50 * S;
        fx.lineTo(x, y);
      }

      fx.fillStyle = 'rgba(229,72,122,.12)';

    fx.strokeStyle = '#3f8f45'; fx.lineWidth = 3 * S;
    for (const f of B.flowers) {
      const k = clamp((t - f.t0) / 0.55, 0, 1);
      if (k <= 0) continue;
      const e = easeOut(k);
      f.px = B.tie.x + (f.x - B.tie.x) * e; f.py = B.tie.y + (f.y - B.tie.y) * e;
      fx.beginPath(); fx.moveTo(B.tie.x, B.tie.y); fx.lineTo(f.px, f.py); fx.stroke();
    }

    for (const f of B.order) {
      const k = clamp((t - f.t0) / 0.55, 0, 1);
      if (k <= 0) continue;
      fx.save(); fx.translate(f.px, f.py);
      drawBloom(f, f.size * easeBack(k));
      fx.restore();
    }

    for (const b of B.breath) {
      const k = clamp((t - b.t0) / 0.4, 0, 1);
      if (k <= 0) continue;
      fx.fillStyle = '#ffffff';
      for (const [dx, dy] of b.dots) { fx.beginPath(); fx.arc(b.x + dx, b.y + dy, 2.6 * S * k, 0, Math.PI * 2); fx.fill(); }
    }

    // Front sheet hides the stems
    if (w > 0) {
      fx.save();
      fx.translate(B.tip.x, B.tip.y); fx.scale(w, w); fx.translate(-B.tip.x, -B.tip.y);
      const top = cy + 85 * S;
      const grad = fx.createLinearGradient(cx - 160 * S, 0, cx + 160 * S, 0);
      grad.addColorStop(0, '#ff8fb8'); grad.addColorStop(0.5, '#ffb3cf'); grad.addColorStop(1, '#f06a9f');
      fx.fillStyle = grad;
      fx.beginPath();
      fx.moveTo(cx - 165 * S, top);
      for (let i = 1; i <= 8; i++) fx.quadraticCurveTo(cx - 165 * S + (i - 0.5) * 41.25 * S, top + 16 * S, cx - 165 * S + i * 41.25 * S, top);
      fx.lineTo(B.tip.x + 14 * S, B.tip.y); fx.lineTo(B.tip.x - 14 * S, B.tip.y);
      fx.closePath(); fx.fill();
      fx.strokeStyle = 'rgba(255,255,255,.35)'; fx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) { fx.beginPath(); fx.moveTo(cx + i * 55 * S, top + 10 * S); fx.lineTo(B.tip.x + i * 5 * S, B.tip.y - 6 * S); fx.stroke(); }

      fx.save(); fx.translate(x, y); fx.scale(s, s);
      fx.fillStyle = '#d61f5c';
      fx.beginPath(); fx.moveTo(-6, 6); fx.quadraticCurveTo(-26, 50, -34, 78); fx.lineTo(-20, 72); fx.lineTo(-12, 84); fx.quadraticCurveTo(-6, 40, 4, 8); fx.fill();
      fx.beginPath(); fx.moveTo(6, 6); fx.quadraticCurveTo(24, 46, 30, 80); fx.lineTo(18, 72); fx.lineTo(8, 82); fx.quadraticCurveTo(4, 40, -4, 8); fx.fill();
      fx.fillStyle = '#ff3d7f';
      for (const sd of [-1, 1]) { fx.beginPath(); fx.ellipse(sd * 30, -4, 32, 18, sd * -0.35, 0, Math.PI * 2); fx.fill(); }
      fx.fillStyle = '#b5124a';
      for (const sd of [-1, 1]) { fx.beginPath(); fx.ellipse(sd * 22, -2, 12, 7, sd * -0.35, 0, Math.PI * 2); fx.fill(); }
      fx.fillStyle = 'rgba(255,255,255,.35)';
      for (const sd of [-1, 1]) { fx.beginPath(); fx.ellipse(sd * 34, -12, 14, 4, sd * -0.35, 0, Math.PI * 2); fx.fill(); }
      fx.fillStyle = '#ff3d7f'; fx.beginPath(); fx.arc(0, 0, 11, 0, Math.PI * 2); fx.fill();
      fx.fillStyle = 'rgba(255,255,255,.4)'; fx.beginPath(); fx.arc(-3, -4, 4, 0, Math.PI * 2); fx.fill();
      fx.restore();
    }

    if (t > B.done) {
      for (const sp of B.sparkles) {
        const a = Math.max(0, Math.sin(time * 2.2 + sp.ph));
        twinkle(sp.x, sp.y, sp.s * (0.5 + a * 0.7), a * 0.95);
      }
    }
  }

  // ---------- Flower rain ----------
  // Each kind is baked once into a small sprite, then thousands of draws are cheap
  const RAIN_KINDS = [
    { kind: 'petal', w: 40, size: 22, flat: true, colors: PINKS },
    { kind: 'sakura', w: 30, size: 38, flat: true, colors: ['#ffc8d9', '#ffd6e4', '#ffb3c7', '#ff8fb8', '#ff6f9f'] },
    { kind: 'heart', w: 10, size: 22, flat: true, colors: ['#ff6f9f', '#e5487a', '#ff8fb8'] },
    { kind: 'rose', w: 8, size: 44, colors: ['#ff6f9f', '#e5487a', '#ffb3c7', '#f7559a'] },
    { kind: 'peony', w: 5, size: 46, colors: ['#ff8fb8', '#ffc8d9'] },
    { kind: 'daisy', w: 3, size: 36, colors: ['#ffc8d9', '#ff8fb8'] },
    { kind: 'tulip', w: 2, size: 40, colors: ['#f7559a', '#ff8fb8'] },
  ];
  let rainSprites = null;

  function petalPath(R) {
    fx.beginPath();
    fx.moveTo(0, R);
    fx.bezierCurveTo(-R * 0.95, R * 0.25, -R * 0.75, -R * 0.85, -R * 0.18, -R * 0.92);
    fx.lineTo(0, -R * 0.62);
    fx.lineTo(R * 0.18, -R * 0.92);
    fx.bezierCurveTo(R * 0.75, -R * 0.85, R * 0.95, R * 0.25, 0, R);
  }
  function bakeRainSprite(kind, c) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 96;
    const prev = fx;
    fx = cv.getContext('2d');
    fx.translate(48, 48);
    const R = 34;
    if (kind === 'petal') {
      fx.scale(0.72, 1);
      const g = fx.createLinearGradient(0, -R, 0, R);
      g.addColorStop(0, shade(c, 28)); g.addColorStop(1, shade(c, -22));
      fx.fillStyle = g; petalPath(R); fx.fill();
      fx.strokeStyle = 'rgba(255,255,255,.45)'; fx.lineWidth = 2;
      fx.beginPath(); fx.moveTo(0, R * 0.8); fx.quadraticCurveTo(-R * 0.1, 0, 0, -R * 0.5); fx.stroke();
    } else if (kind === 'sakura') {
      for (let i = 0; i < 5; i++) {
        fx.save(); fx.rotate(i * 1.2566); fx.translate(0, -R * 0.5);
        const g = fx.createLinearGradient(0, -R * 0.5, 0, R * 0.5);
        g.addColorStop(0, shade(c, 20)); g.addColorStop(1, shade(c, -30));
        fx.fillStyle = g; petalPath(R * 0.5); fx.fill();
        fx.restore();
      }
      fx.fillStyle = shade(c, -60); fx.beginPath(); fx.arc(0, 0, R * 0.18, 0, Math.PI * 2); fx.fill();
      fx.strokeStyle = shade(c, -70); fx.lineWidth = 1.5; fx.fillStyle = '#ffd166';
      for (let i = 0; i < 8; i++) {
        const a = i * 0.785 + 0.3, x = Math.cos(a) * R * 0.38, y = Math.sin(a) * R * 0.38;
        fx.beginPath(); fx.moveTo(0, 0); fx.lineTo(x, y); fx.stroke();
        fx.beginPath(); fx.arc(x, y, 2.6, 0, Math.PI * 2); fx.fill();
      }
    } else if (kind === 'heart') {
      const g = fx.createLinearGradient(0, -R, 0, R);
      g.addColorStop(0, shade(c, 30)); g.addColorStop(1, shade(c, -20));
      fx.fillStyle = g; fxHeart(0, -R * 0.8, R * 1.7); fx.fill();
      fx.fillStyle = 'rgba(255,255,255,.4)'; fx.beginPath(); fx.ellipse(-R * 0.35, -R * 0.2, R * 0.14, R * 0.24, 0.5, 0, Math.PI * 2); fx.fill();
    } else {

    }

    return cv;
  }
  function bakeRain() {
    rainSprites = [];
    for (const k of RAIN_KINDS) for (const c of k.colors) rainSprites.push({ img: bakeRainSprite(k.kind, c), size: k.size, flat: !!k.flat, w: k.w / k.colors.length });
    rainSprites.total = rainSprites.reduce((s, r) => s + r.w, 0);
  }
  function pickRain() {
    let r = Math.random() * rainSprites.total;
    for (const s of rainSprites) { r -= s.w; if (r <= 0) return s; }
    return rainSprites[0];
  }

  // z is depth: small, faint and slow far away, big and fast up close
  function rainDepth() {
    const r = Math.random();
    return r < 0.6 ? rand(0.35, 1) : r < 0.95 ? rand(1, 1.35) : rand(1.45, 1.9);
  }
  function addRain(x, y, vx, vy, z = rainDepth(), drag = 1.2) {
    if (fin.rain.length > 520) return;
    const spr = pickRain();
    fin.rain.push({
      spr, x, y, vx, vy, z, drag, s: spr.size * z * clamp(Math.min(VW, VH) / 650, 0.65, 1.3),
      term: rand(45, 85) * Math.pow(z, 0.8) * (spr.flat ? 1 : 1.35),
      rot: rand(0, 6.28), vr: rand(-2.5, 2.5), flip: rand(0, 6.28), vf: rand(1.5, 4.5),
      ph: rand(0, 6.28), sway: rand(14, 40), glit: Math.random() < 0.2,
      gy: VH - rand(2, 26), lands: z > 0.7 && z < 1.15,
    });
  }
  function flowerBurst(x, y, n, speed, up = 120) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), v = rand(0.35, 1) * speed;
      addRain(x, y, Math.cos(a) * v, Math.sin(a) * v - up, rand(0.6, 1.6), 1.7);
    }
  }
  function flowerCannon(fromLeft) {
    const k = Math.min(1.15, VH / 700);
    for (let i = 0; i < 46; i++) {
      const a = -Math.PI / 2 + (fromLeft ? 1 : -1) * rand(0.15, 0.7), v = rand(700, 1150) * k;
      addRain(fromLeft ? -10 : VW + 10, VH + 10, Math.cos(a) * v, Math.sin(a) * v, rand(0.6, 1.5), 1.6);
    }
    sfx(180, 0.25, 'triangle', 0.08, 500);
  }
  function whoosh() {
    if (!actx || muted) return;
    const t = actx.currentTime, len = actx.sampleRate * 1.8;
    const buf = actx.createBuffer(1, len, actx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
    const src = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(1400, t + 0.9); bp.frequency.exponentialRampToValueAtTime(400, t + 1.8);
    g.gain.value = 0.06;
    src.connect(bp).connect(g).connect(actx.destination);
    src.start(t);
  }

  function updateRain(dt, t) {
    // Gentle breeze plus a strong gust now and then
    fin.nextGust -= dt;
    if (fin.nextGust <= 0 && t > 4) {
      fin.gust = { t: 0, dur: 2.4, str: (Math.random() < 0.5 ? -1 : 1) * rand(170, 260) };
      fin.nextGust = rand(6, 9);
      whoosh();
    }
    let wind = Math.sin(time * 0.35) * 28;
    if (fin.gust) {
      fin.gust.t += dt;
      wind += Math.sin(Math.PI * clamp(fin.gust.t / fin.gust.dur, 0, 1)) * fin.gust.str;
      if (fin.gust.t > fin.gust.dur) fin.gust = null;
    }
    const spin = 1 + Math.abs(wind) / 90;

    // Spawn: it starts after the boom, then pours when the bouquet is tied
    fin.surge = Math.max(0, fin.surge - dt);
    const rate = clamp((t - 1.2) / 3, 0, 1) * 16 + (fin.surge > 0 ? 55 : 0) + (state === 'letter' ? 10 : 0);
    fin.spawn += rate * dt;
    while (fin.spawn >= 1) {
      fin.spawn--;
      const z = rainDepth();
      addRain(rand(-VW * 0.2, VW * 1.2) - wind * 2, rand(-60, -20), wind * z, rand(20, 60) * z, z);
    }

    const m = fin.mouse;
    for (const p of fin.rain) {
      const k = Math.min(1, p.drag * dt);
      p.vx += (wind * (0.4 + 0.6 * p.z) - p.vx) * k;
      p.vy += (p.term - p.vy) * k;
      if (m) {
        const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy);
        if (d < 110 && d > 1) { const f = (1 - d / 110) * 2400 * dt; p.vx += dx / d * f; p.vy += dy / d * f; p.vr += f * 0.01; }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt * spin; p.flip += p.vf * dt * spin;
      if (p.lands && p.vy > 0 && p.y > p.gy) {
        p.dead = true;
        fin.pile.push({ spr: p.spr, x: p.x + Math.sin(time * 1.3 + p.ph) * p.sway, y: p.gy, rot: p.rot, sx: 0.4 + 0.6 * Math.abs(Math.cos(p.flip)), s: p.s });
      }
    }
    if (fin.pile.length > 320) fin.pile.splice(0, fin.pile.length - 320);
    fin.rain = fin.rain.filter(p => !p.dead && p.y < VH + 80 && p.x > -VW * 0.4 && p.x < VW * 1.4);
  }

  function drawRainItem(p) {
    const x = p.x + Math.sin(time * 1.3 + p.ph) * p.sway * Math.min(1, p.vy / 40), s = p.s;
    const c = Math.cos(p.flip);
    fx.save();
    fx.translate(x, p.y); fx.rotate(p.rot);
    // Tumbling in 3D: flat petals flip edge-on, whole blooms just tilt
    if (p.spr.flat) fx.scale(Math.abs(c) < 0.08 ? 0.08 : c, 1);
    else fx.scale(1, 0.72 + 0.28 * c);
    fx.globalAlpha = (p.z < 1 ? 0.35 + 0.6 * p.z : p.z > 1.4 ? 0.8 : 1) * (p.spr.flat ? 0.75 + 0.25 * Math.abs(c) : 1);
    fx.drawImage(p.spr.img, -s / 2, -s / 2, s, s);
    fx.restore();
    if (p.glit) {
      const a = Math.sin(time * 5 + p.ph * 3);
      if (a > 0.5) twinkle(x + s * 0.3, p.y - s * 0.3, 3 + 4 * p.z, (a - 0.5) * 1.6);
    }
  }
  function drawRain(front) {
    // During the movie only light petals drift over the photos
    const light = state === 'movie';
    for (const p of fin.rain) if ((p.z >= 1) === front && !(light && !p.spr.flat)) drawRainItem(p);
    fx.globalAlpha = 1;
  }
  function drawPile() {
    for (const q of fin.pile) {
      fx.save(); fx.translate(q.x, q.y); fx.rotate(q.rot); fx.scale(q.sx, 0.55);
      fx.globalAlpha = 0.95;
      fx.drawImage(q.spr.img, -q.s / 2, -q.s / 2, q.s, q.s);
      fx.restore();
    }
    fx.globalAlpha = 1;
  }

  fc.addEventListener('pointermove', e => { if (fin) fin.mouse = { x: e.clientX, y: e.clientY }; });
  fc.addEventListener('pointerleave', () => { if (fin) fin.mouse = null; });
  fc.addEventListener('pointerdown', e => {
    if (!fin) return;
    initAudio();
    flowerBurst(e.clientX, e.clientY, 26, 420);
    sfx(pick(NOTES), 0.35, 'triangle', 0.05);
  });

  function drawFinale(dt) {
    if (!fin) return;
    fin.t += dt;
    const t = fin.t, B = fin.B;
    fx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Sky warms from night to rosy dusk
    const warm = clamp((t - 1.5) / 5, 0, 1);
    const sky = fx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, `rgb(${18 + warm * 40},${12 + warm * 8},${40 + warm * 30})`);
    sky.addColorStop(0.6, `rgb(${50 + warm * 110},${22 + warm * 30},${70 + warm * 40})`);
    sky.addColorStop(1, `rgb(${70 + warm * 170},${30 + warm * 90},${80 + warm * 60})`);

    }

    if (rays > 0) {
      fx.save(); fx.translate(B.cx, B.cy); fx.rotate(time * 0.08);
      const R = Math.max(VW, VH);
      for (let i = 0; i < 14; i++) {
        fx.rotate(Math.PI * 2 / 14);
        fx.fillStyle = `rgba(255,220,235,${0.05 * rays})`;
        fx.beginPath(); fx.moveTo(0, 0); fx.lineTo(R, -R * 0.09); fx.lineTo(R, R * 0.09); fx.closePath(); fx.fill();

    for (const L of fin.lanterns) {
      L.y -= L.vy * dt;
      const x = L.x + Math.sin(time * 0.8 + L.ph) * 18;
      const g = fx.createRadialGradient(x, L.y + L.s * 0.45, 0, x, L.y + L.s * 0.45, L.s * 1.8);
      g.addColorStop(0, 'rgba(255,150,190,.45)'); g.addColorStop(1, 'rgba(255,150,190,0)');
      fx.fillStyle = g; fx.fillRect(x - L.s * 2, L.y - L.s * 1.5, L.s * 4, L.s * 4);
      fx.fillStyle = 'rgba(255,120,170,.75)'; fxHeart(x, L.y, L.s); fx.fill();
      fx.fillStyle = 'rgba(255,240,200,.6)'; fxHeart(x, L.y + L.s * 0.25, L.s * 0.5); fx.fill();

      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;

      fx.beginPath(); fx.arc(p.x, p.y, 2.4, 0, Math.PI * 2); fx.fill();

    fin.sparks = fin.sparks.filter(p => p.life > 0);
    fx.globalCompositeOperation = 'source-over';
    fx.globalAlpha = 1;

    // The boom blows a cloud of flowers out of the chest, then the rain begins
    if (!fin.exploded && t > 0.12) { fin.exploded = true; flowerBurst(VW / 2, VH * 0.45, 90, 900, 150); }
    updateRain(dt, t);
    drawRain(false);
    drawPile();

    drawBouquet(t);
    if (t > B.done) {
      const k = clamp((t - B.done) / 0.6, 0, 1);
      const gs = 2.3 * B.S, gx = B.cx - Math.min(235 * B.S, VW * 0.36), gy = B.tip.y + 10 * B.S - Math.sin(k * Math.PI) * 40 * B.S;
      fx.save(); fx.globalAlpha = k; fx.translate(gx, gy); fx.scale(gs, gs);
      fx.fillStyle = 'rgba(60,10,40,.25)'; fx.beginPath(); fx.ellipse(0, 0, 14, 3, 0, 0, Math.PI * 2); fx.fill();
      drawGirl(fx, look, { fx: 0.4, fy: 0.3, phase: time * 4 });
      fx.restore(); fx.globalAlpha = 1;
    }

    // Sounds as each bloom lands, and the ribbon
    while (fin.popped < B.flowers.length && t > B.flowers[fin.popped].t0 + 0.3) {
      const f = B.flowers[fin.popped];
      if (!f.quiet) sfx(NOTES[fin.popped % NOTES.length], 0.35, 'triangle', 0.03);
      if (f.hero) {
        chime([1046, 1318, 1568]);
        for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; fin.sparks.push({ x: f.x, y: f.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, life: 0.8, max: 0.8, c: '#ffe08a', heart: true }); }
      }
      fin.popped++;
    }
    if (!fin.tied && t > B.done + 0.2) {
      fin.tied = true;
      chime([784, 988, 1175, 1568]);
      firework(VW * 0.25, VH * 0.2, 70, true);
      firework(VW * 0.75, VH * 0.2, 70, true);
      flowerCannon(true); flowerCannon(false);
      fin.surge = 3.5;
    }

    if (state === 'letter' || state === 'movie') {
      // Over the letter and the movie the flowers fall in front of it, on their own canvas
      rtx.setTransform(DPR, 0, 0, DPR, 0, 0); rtx.clearRect(0, 0, VW, VH);
      const prev = fx; fx = rtx; drawRain(true); fx = prev;
    } else drawRain(true);

    // Greeting
    const gt = B.done + 0.5;
    if (state === 'finale' && t > gt) {
      const a = clamp((t - gt) / 1.2, 0, 1);
      fx.globalAlpha = a;
      fx.textAlign = 'center';
      const s1 = Math.min(46, VW / 14), s2 = Math.min(60, VW / 10);
      const y = Math.max(s1 + 10, B.cy - B.ry - 190 * B.S) + (1 - a) * 20;
      fx.font = `700 ${s1}px Fredoka, system-ui, sans-serif`;
      fx.strokeStyle = 'rgba(60,10,40,.55)'; fx.lineWidth = 6; fx.lineJoin = 'round';
      const hello = 'Happy 2nd Anniversary';
      const fit = Math.min(1, (VW - 32) / fx.measureText(hello).width);
      fx.save(); fx.translate(VW / 2, y); fx.scale(fit, fit);
      fx.strokeText(hello, 0, 0); fx.fillStyle = '#fff'; fx.fillText(hello, 0, 0);
      fx.restore();
      fx.font = `700 ${s2}px Caveat, cursive`;
      const name = fmt('{her}') + ' 💗';
      fx.strokeText(name, VW / 2, y + s2 * 0.95); fx.fillStyle = '#ffd166'; fx.fillText(name, VW / 2, y + s2 * 0.95);
      fx.globalAlpha = 1;
    }
    if (!fin.btn && t > gt + 1.8) {
      fin.btn = true;
      $('finaleBtn').textContent = hasMovie() ? 'Watch our story 🎬' : 'Open your letter 💌';
      $('finaleBtn').classList.remove('hidden');
    }

    // The BOOM: white flash and shockwave
    if (t < 0.9) {
      fx.strokeStyle = `rgba(255,240,250,${1 - t / 0.9})`; fx.lineWidth = 30 * (1 - t / 0.9) + 2;
      fx.beginPath(); fx.arc(VW / 2, VH * 0.45, t * Math.max(VW, VH) * 1.4, 0, Math.PI * 2); fx.stroke();
      fx.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - t / 0.5)})`; fx.fillRect(0, 0, VW, VH);
    }
    if (t < 0.6) {
      const k = (1 - t / 0.6) * 18;
      fc.style.transform = `translate(${rand(-k, k)}px,${rand(-k, k)}px)`;
    } else fc.style.transform = '';
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    if (fin) drawFinale(dt); else render();
    if (state === 'wardrobe') drawWardrobePreview(dt);
    $('wardrobeBtn').classList.toggle('hidden', state !== 'play');
    requestAnimationFrame(frame);
  }

  buildWorld();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
